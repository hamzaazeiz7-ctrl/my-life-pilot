<script>
'use strict';
/* ================= My Life Pilot V0.3.1 — noyau : utilitaires, stockage, calculs ================= */
const VERSION = '0.8.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const NOWFN = () => (window.__NOW ? new Date(window.__NOW) : new Date());
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const todayStr = () => ymd(NOWFN());
const nowMin = () => { const d = NOWFN(); return d.getHours() * 60 + d.getMinutes(); };
const hm2min = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const min2hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const fmtDur = m => { m = Math.round(m); if (m < 0) return '-' + fmtDur(-m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? pad(r) : ''}` : `${r} min`; };
const dow = s => (parseYmd(s).getDay() + 6) % 7;
const weekStartOf = s => addDays(s, -dow(s));
const monthRange = s => { const d = parseYmd(s); return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; };
const DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const DAYSL = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const fmtDate = s => { const d = parseYmd(s); return `${DAYSL[dow(s)].toLowerCase()} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parseYmd(s); return `${DAYS[dow(s)]} ${d.getDate()}/${pad(d.getMonth() + 1)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => (a.length ? sum(a) / a.length : null);

const STATUS = { planned: ['Prévue', '🕒'], inprogress: ['En cours', '▶️'], done: ['Terminée', '✅'], partial: ['Partielle', '🟡'], postponed: ['Reportée', '↪️'], cancelled: ['Annulée', '🚫'], missed: ['Non réalisée', '❌'], unfilled: ['Non renseignée', '❓'] };
const PRAYERS = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
const DEFAULT_REASONS = ['Imprévu professionnel', 'Fatigue', 'Famille / social', 'Déplacement', 'Santé', 'Oubli', 'Manque de motivation', 'Autre'];

/* ---------------- données par défaut ---------------- */
function defaults() {
  const free = {};
  for (let i = 0; i < 7; i++) free[i] = i < 5 ? ['18:45', '22:30'] : ['09:00', '22:30'];
  return {
    v: 1, created: Date.now(),
    settings: { theme: 'auto', bilanHour: 23, free, notif: false },
    quotas: [
      { id: 'sport', label: 'Sport', icon: '🏃', color: '#e5383b', kind: 'count', mode: 'min', week: 3, day: null, unit: 'séance', sessionMin: 120, prio: 1 },
      { id: 'revision', label: 'Révision', icon: '📚', color: '#4f5bd5', kind: 'duration', mode: 'min', week: 420, day: null, sessionMin: 90, prio: 2 },
      { id: 'freelance', label: 'Freelance', icon: '💼', color: '#0f9d9a', kind: 'duration', mode: 'min', week: 1200, day: null, sessionMin: 120, prio: 3 },
      { id: 'apprentissage', label: 'Apprentissage & formation', icon: '🎓', color: '#2e9e49', kind: 'duration', mode: 'min', week: 720, day: null, sessionMin: 60, prio: 4 },
      { id: 'cafe', label: 'Café hors maison', icon: '☕', color: '#b8742a', kind: 'duration', mode: 'max', week: 1200, day: null, overlap: true, sessionMin: 60, prio: 9 },
      { id: 'sommeil', label: 'Sommeil', icon: '😴', color: '#7c5cff', kind: 'duration', mode: 'min', week: 2940, day: 420, noPlan: true, prio: 9 },
      { id: 'cigarette', label: 'Cigarettes', icon: '🚬', color: '#7a7f99', kind: 'count', mode: 'max', week: 140, day: 20, unit: 'cig.', noPlan: true, prio: 9 },
      { id: 'priere', label: 'Prières', icon: '🕌', color: '#14956b', kind: 'count', mode: 'min', week: 35, day: 5, unit: 'prière', noPlan: true, prayers: true, prio: 9 }
    ],
    blocks: [], entries: [], libre: [], appts: [], reviews: {}, wreviews: {}, proposals: [], audit: [],
    reasons: DEFAULT_REASONS.slice(), timer: null, notified: {}
  };
}


/* ---------------- validation / assainissement d'un état (import, copie, fichier distant, chargement) ---------------- */
function sanitizeState(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('format');
  const D = /^\d{4}-\d\d-\d\d$/, T = /^\d{1,2}:\d\d$/, C = /^#[0-9a-fA-F]{6}$/, I = /^[\w:.\-]{1,64}$/;
  const arr = k => { if (raw[k] !== undefined && !Array.isArray(raw[k])) throw new Error('format:' + k); return (raw[k] || []).filter(x => x && typeof x === 'object' && !Array.isArray(x)); };
  const obj = k => { if (raw[k] !== undefined && raw[k] !== null && (typeof raw[k] !== 'object' || Array.isArray(raw[k]))) throw new Error('format:' + k); return raw[k] || {}; };
  if (!Array.isArray(raw.quotas) || !Array.isArray(raw.entries) || !Array.isArray(raw.blocks)) throw new Error('format');
  const d0 = defaults(), out = Object.assign({}, raw);
  const num = (x, def = 0) => (Number.isFinite(+x) ? +x : def);
  out.quotas = arr('quotas').filter(q => I.test(String(q.id))).map(q => Object.assign({}, q, {
    id: String(q.id), label: String(q.label ?? q.id).slice(0, 60), icon: [...String(q.icon || '⭐').replace(/[<>&"'`]/g, '')].slice(0, 3).join('') || '⭐',
    color: C.test(q.color) ? q.color : '#6d7399', unit: q.unit == null ? q.unit : String(q.unit).replace(/[<>&"'`]/g, '').slice(0, 12),
    kind: q.kind === 'count' ? 'count' : 'duration', mode: q.mode === 'max' ? 'max' : 'min',
    week: num(q.week) > 0 ? num(q.week) : 1, day: q.day == null || !(num(q.day) > 0) ? null : num(q.day), prio: num(q.prio, 9)
  }));
  const okD = x => !x.date || D.test(x.date), okT = (x, ...ks) => ks.every(k => !x[k] || T.test(x[k]));
  out.entries = arr('entries').filter(x => I.test(String(x.id)) && D.test(x.date) && okT(x, 'time') && Number.isFinite(+x.v)).map(x => Object.assign({}, x, { id: String(x.id), cat: String(x.cat ?? '').slice(0, 64), v: +x.v }));
  out.blocks = arr('blocks').filter(x => I.test(String(x.id)) && D.test(x.date) && T.test(x.start) && T.test(x.end) && STATUS[x.status]).map(x => Object.assign({}, x, { id: String(x.id), q: x.q == null ? null : String(x.q) }));
  out.appts = arr('appts').filter(x => I.test(String(x.id)) && D.test(x.date) && okT(x, 'time')).map(x => Object.assign({}, x, { id: String(x.id) }));
  out.libre = arr('libre').filter(x => I.test(String(x.id)) && okD(x) && okT(x, 'from', 'to')).map(x => Object.assign({}, x, { id: String(x.id) }));
  out.proposals = arr('proposals').filter(x => x && I.test(String(x.id ?? 'p')) ).map(x => Object.assign({}, x, { kind: String(x.kind ?? '').slice(0, 30), decision: x.decision == null ? x.decision : String(x.decision).slice(0, 30) }));
  out.audit = arr('audit');
  const clean = o => { const r = {}; for (const k of Object.keys(o)) if (D.test(k) && o[k] && typeof o[k] === 'object') r[k] = o[k]; return r; };
  out.reviews = clean(obj('reviews')); out.wreviews = obj('wreviews'); out.notified = obj('notified');
  const st = obj('settings'); out.settings = Object.assign({}, d0.settings, st);
  out.settings.name = st.name == null ? st.name : String(st.name).slice(0, 40);
  out.settings.bilanHour = clamp(num(st.bilanHour, 23), 0, 23);
  if (!['auto', 'light', 'dark', 'obsidian'].includes(out.settings.theme)) out.settings.theme = 'auto';
  const free = {}; for (let i = 0; i < 7; i++) { const w = out.settings.free && out.settings.free[i]; free[i] = Array.isArray(w) && T.test(w[0]) && T.test(w[1]) ? [w[0], w[1]] : null; if (free[i] === null && !(out.settings.free && i in out.settings.free)) free[i] = d0.settings.free[i]; }
  out.settings.free = free;
  out.reasons = Array.isArray(raw.reasons) ? raw.reasons.map(x => String(x).slice(0, 60)) : d0.reasons;
  if (out.timer && typeof out.timer !== 'object') out.timer = null;
  return out;
}

/* ---------------- stockage IndexedDB (+ repli localStorage) ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('mylifepilot', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode), s = t.objectStore('kv'), r = fn(s);
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('abort'));
    });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  keys() { return this.tx('readonly', s => s.getAllKeys()); }
};
let S = null, saveT = null, storageMode = 'idb';
const TABID = Math.random().toString(36).slice(2);
async function load() {
  try { await DB.open(); S = await DB.get('state'); } catch (e) { storageMode = 'ls'; }
  if (!S) { try { S = JSON.parse(localStorage.getItem('mlp_state') || 'null'); } catch (e) { } }
  if (S) { try { S = sanitizeState(S); } catch (e) { try { await DB.set('bak-etat-illisible-' + Date.now(), JSON.stringify(S)); } catch (e2) { } S = null; } }
  if (!S) S = defaults();
  migrate();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  dailyBackup();
}
function migrate() {
  const d = defaults();
  for (const k of Object.keys(d)) if (S[k] === undefined) S[k] = d[k];
  for (const k of Object.keys(d.settings)) if (S.settings[k] === undefined) S.settings[k] = d.settings[k];
  S.blocks.forEach(b => { if (b.q === undefined) b.q = null; });
}
async function persist() {
  clearTimeout(saveT); saveT = null;
  try {
    if (storageMode === 'idb') await DB.set('state', JSON.parse(JSON.stringify(S)));
    else localStorage.setItem('mlp_state', JSON.stringify(S));
    try { if (window.__bc) window.__bc.postMessage({ id: TABID, mod: S._mod || 0 }); } catch (e) { }
    return true;
  } catch (e) {
    try { localStorage.setItem('mlp_state', JSON.stringify(S)); return storageMode !== 'idb' ? true : false; } catch (e2) { toast('⚠️ Échec de la sauvegarde locale. Exportez vos données.', 'danger'); return false; }
  }
}
function save() { clearTimeout(saveT); saveT = setTimeout(persist, 250); S._mod = Date.now(); if (typeof syncSoon === 'function') syncSoon(); }
async function dailyBackup() {
  if (storageMode !== 'idb') return;
  try {
    const k = 'bak-' + todayStr(), keys = await DB.keys();
    if (!keys.includes(k)) await DB.set(k, JSON.stringify(S));
    const baks = keys.filter(x => /^bak-\d{4}-\d\d-\d\d$/.test(String(x))).sort();
    while (baks.length > 7) await DB.del(baks.shift());
  } catch (e) { }
}
function log(type, text, ref) {
  S.audit.push({ id: uid(), ts: Date.now(), type, text, ref: ref || null });
  if (S.audit.length > 3000) S.audit.splice(0, S.audit.length - 3000);
}

/* ---------------- accès / entités ---------------- */
/* durées saisies librement : 1:40 · 1h40 · 1h · 40 min · 100 (minutes) · 1,5 (= 1h30) */
function parseDur(s) {
  s = String(s ?? '').trim().toLowerCase().replace(',', '.').replace(/\s+/g, ' ');
  if (s === '') return 0;
  let m;
  if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
  if ((m = s.match(/^(\d+(?:\.\d+)?) ?h(?: ?(\d{1,2}) ?(?:min|mn|m)?)?$/))) return Math.round(+m[1] * 60 + (+m[2] || 0));
  if ((m = s.match(/^(\d+(?:\.\d+)?) ?(?:min|mn|m)$/))) return Math.round(+m[1]);
  if (/^\d+$/.test(s)) return +s;
  if (/^\d+\.\d+$/.test(s)) return Math.round(parseFloat(s) * 60);
  return null;
}
const pd = s => { const v = parseDur(s); return v == null ? 0 : v; };
const durInput = (name, min, ph = 'ex. 1:40') => `<input type="text" name="${name}" data-dur autocomplete="off" inputmode="text" value="${min ? fmtDur(min) : ''}" placeholder="${ph}"><span class="rt dh">${min ? '= ' + fmtDur(min) : ''}</span>`;
const Q = id => S.quotas.find(q => q.id === id);
const qLabel = id => { const q = Q(id); return q ? `${q.icon} ${q.label}` : '—'; };
function fmtVal(q, v) { if (!q) return String(v); return q.kind === 'duration' ? fmtDur(v) : `${v}${q.unit ? ' ' + q.unit : ''}`; }
function fmtTarget(q, v) { return q.kind === 'duration' ? fmtDur(v) : `${Math.round(v * 10) / 10}`; }
function entryMins(e) { const q = Q(e.cat); return q ? (q.kind === 'duration' ? e.v : (e.mins || 0)) : 0; }
function addEntry(o) {
  const e = Object.assign({ id: uid(), date: todayStr(), time: min2hm(nowMin()), v: 0, src: 'manual', note: '', ts: Date.now() }, o);
  S.entries.push(e);
  const q = Q(e.cat);
  log('saisie', `${q ? q.label : e.cat} : ${q ? fmtVal(q, e.v) : e.v}${e.sub ? ' (' + e.sub + ')' : ''} — ${e.date} ${e.time}`, e.id);
  save();
  return e;
}
function qDone(q, from, to) { let t = 0; for (const e of S.entries) if (e.cat === q.id && e.date >= from && e.date <= to) t += e.v; return t; }

/* ---------------- blocs de planning ---------------- */
const blockPlanned = b => hm2min(b.end) - hm2min(b.start);
const blockActual = b => sum(S.entries.filter(e => e.blockId === b.id).map(entryMins));
function blockEnded(b) { const t = todayStr(); return b.date < t || (b.date === t && hm2min(b.end) <= nowMin()); }
function blockStarted(b) { const t = todayStr(); return b.date < t || (b.date === t && hm2min(b.start) <= nowMin()); }
function effStatus(b) {
  if ((b.status === 'planned' || b.status === 'inprogress') && blockEnded(b)) return 'unfilled';
  if (b.status === 'planned' && blockActual(b) > 0) return 'inprogress';
  return b.status;
}
function blockColor(b) { const q = Q(b.q); return q ? q.color : '#6d7399'; }

/* ---------------- créneaux libres & planificateur ---------------- */
function busyOf(date, excludeId) {
  const out = [];
  for (const b of S.blocks) if (b.date === date && b.id !== excludeId && ['planned', 'inprogress', 'done', 'partial'].includes(b.status)) out.push([hm2min(b.start), hm2min(b.end), b.title]);
  for (const a of S.appts) if (a.date === date && !a.done && a.time) out.push([hm2min(a.time), hm2min(a.time) + (a.dur || 60), a.title]);
  for (const l of S.libre) if (l.date === date && l.from && l.to) out.push([hm2min(l.from), hm2min(l.to), l.text]);
  return out.sort((a, b) => a[0] - b[0]);
}
function freeSlots(date, { notBefore = 0, margin = 10, excludeId, extra = [] } = {}) {
  const w = S.settings.free[dow(date)]; if (!w) return [];
  const e = hm2min(w[1]); let cur = Math.max(hm2min(w[0]), notBefore);
  const busy = busyOf(date, excludeId).concat(extra.map(x => [x[0], x[1]])).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [bs, be] of busy) {
    if (be + margin <= cur) continue;
    if (bs - margin > cur) out.push([cur, Math.min(bs - margin, e)]);
    cur = Math.max(cur, be + margin);
    if (cur >= e) break;

function isoWeek(s) { const d = parseYmd(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); }

/* ---------- CALENDRIER ---------- */
function dayItems(date) {
  const it = [];
  S.blocks.filter(b => b.date === date).forEach(b => it.push({ k: 'b', id: b.id, s: hm2min(b.start), e: hm2min(b.end), title: b.title, b }));
  S.appts.filter(a => a.date === date && a.time).forEach(a => it.push({ k: 'a', id: a.id, s: hm2min(a.time), e: hm2min(a.time) + (a.dur || 60), title: '🔔 ' + a.title, a }));
  S.libre.filter(l => l.date === date && l.from && l.to).forEach(l => it.push({ k: 'l', id: l.id, s: hm2min(l.from), e: hm2min(l.to), title: '📝 ' + l.text, l }));
  return it.sort((x, y) => x.s - y.s || x.e - y.e);
}
function layoutCols(items) {
  const out = []; let cl = [], end = -1;
  const flush = () => { const cols = []; cl.forEach(i => { let c = cols.findIndex(ce => ce <= i.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = i.e; i.col = c; }); cl.forEach(i => i.n = cols.length); out.push(...cl); cl = []; };
  for (const i of items) { if (cl.length && i.s >= end) { flush(); end = -1; } cl.push(i); end = Math.max(end, i.e); }
  if (cl.length) flush();
  return out;
}
function timeline(dates, sc = 1.1) {
  const H0 = 360, H1 = 1440, ht = (H1 - H0) * sc, t = todayStr(), nm = nowMin();
  let h = `<div class="cal" style="--n:${dates.length};--sc:${sc}"><div class="cdh"></div>` + dates.map(d => `<div class="cdh ${d === t ? 'today' : ''}" ${A('calDay', { date: d })} style="cursor:pointer">${dates.length > 1 ? fmtShort(d) : fmtDate(d)}</div>`).join('');
  h += `<div class="hc" style="height:${ht}px">${[...Array(19)].map((_, i) => `<span style="top:${i * 60 * sc}px">${pad(6 + i)}h</span>`).join('')}</div>`;
  for (const d of dates) {
    const items = layoutCols(dayItems(d));
    h += `<div class="dc" ${A('colclick', { date: d })} style="height:${ht}px">`;
    for (const i of items) {
      const top = (Math.max(i.s, H0) - H0) * sc, hh = Math.max(22, (Math.min(i.e, H1) - Math.max(i.s, H0)) * sc - 2), w = 100 / i.n;
      let cls = 'blk', st = '', c = '#6d7399', ic = '', extra = '';
      if (i.k === 'b') { const b = i.b; st = effStatus(b); c = blockColor(b); cls += ` st-${st}` + (b.q ? '' : ' fx'); ic = STATUS[st][1]; const a = Math.round(blockActual(b)); if (a) extra = ` · ${fmtDur(a)}`; }
      else if (i.k === 'a') { cls += ' ap'; ic = i.a.done ? '✅' : ''; }
      else cls += ' lb';
      h += `<div class="${cls}" style="top:${top}px;height:${hh}px;left:calc(${i.col * w}% + 1px);width:calc(${w}% - 3px);--c:${c}" ${A('calItem', { k: i.k, id: i.id })}><b>${ic} ${esc(i.title)}</b>${hh > 34 ? `<span>${min2hm(i.s)}–${min2hm(i.e)}${extra}</span>` : ''}</div>`;
    }
    if (d === t && nm >= H0) h += `<div class="nowl" style="top:${(nm - H0) * sc}px"></div>`;
    h += '</div>';
  }
  return h + '</div>';
}
function vCal() {
  const t = todayStr(), d = UI.calDate || t, v = UI.calView;
  const step = v === 'day' ? 1 : v === 'week' ? 7 : 30;

  else if (v === 'week') { const ws = weekStartOf(d); title = `Semaine du ${fmtShort(ws)} au ${fmtShort(addDays(ws, 6))}`; body = `<div class="tw">${timeline([...Array(7)].map((_, i) => addDays(ws, i)), .95)}</div>`; }
  else {

      g += `<div class="mc ${x === t ? 'today' : ''} ${out ? 'out' : ''}" ${A('calDay', { date: x })}><div class="dn">${parseYmd(x).getDate()}</div>${mk}</div>`;

function scoreInfo(k, d) {
  const bar = r => `<div style="background:var(--soft);border-radius:99px;height:8px;min-width:70px"><div style="width:${Math.round(Math.min(1, r) * 100)}%;height:8px;border-radius:99px;background:var(--${r >= .8 ? 'ok' : r >= .5 ? 'warn' : 'bad'})"></div></div>`;

    const i = dayInfo(d);
    h = `<h2>Comment est calculé le score du jour ?</h2><p class="sub">Le score du ${fmtDate(d)} est la <b>moyenne simple</b> de plusieurs notes entre 0 et 100 % : chaque critère pèse autant.</p>

  const dailyItems = st.series.map(x => ({ l: kind === 'week' ? DAYS[dow(x.d)] : String(parseYmd(x.d).getDate()), v: q1 ? (q1.kind === 'duration' ? x.v / 60 : x.v) : x.v / 60, c: x.d === todayStr() ? 'var(--p)' : (q1 ? q1.color : 'var(--p2)'), dim: x.d > todayStr() }));
  const tgt = q1 ? (q1.day != null ? q1.day : q1.week / 7) / (q1.kind === 'duration' ? 60 : 1) : null;
  const dist = Object.entries(st.timeBy).map(([id, v]) => ({ l: Q(id).label, v, c: Q(id).color })).sort((a, b) => b.v - a.v);
  const wk = []; const ws0 = weekStartOf(date); for (let i = 7; i >= 0; i--) { const w = addDays(ws0, -7 * i); wk.push({ l: String(parseYmd(w).getDate()) + '/' + pad(parseYmd(w).getMonth() + 1), v: weekInfo(w, qf).score }); }
  const hmap = {}; const hFrom = addDays(weekStartOf(todayStr()), -7 * 14);
  for (let d = hFrom; d <= todayStr(); d = addDays(d, 1)) { if (q1) hmap[d] = dayRatio(q1, d); else { const s = dayInfo(d).score; hmap[d] = s == null ? null : s / 100; } }
  const reasons = Object.entries(st.reasons).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l: l.length > 12 ? l.slice(0, 11) + '…' : l, v, c: 'var(--warn)' }));
  let mgrid = '';
  if (kind === 'month') {
    const [f, l] = monthRange(date); mgrid = DAYS.map(x => `<div class="rt" style="text-align:center;font-weight:700">${x}</div>`).join('');
    for (let x = weekStartOf(f); x <= addDays(weekStartOf(l), 6); x = addDays(x, 1)) {
      const out = x < f || x > l; let mk = '';
      if (!out && x <= todayStr()) { const r = q1 ? dayRatio(q1, x) : (() => { const s = dayInfo(x).score; return s == null ? null : s / 100; })(); mk = r == null ? '<div class="mk" style="opacity:.25">·</div>' : r >= 1 - 1e-9 || (!q1 && r >= .8) ? '<div class="mk y">✓</div>' : r >= .5 ? '<div class="mk q">≈</div>' : '<div class="mk n">✗</div>'; }
      mgrid += `<div class="mc ${out ? 'out' : ''} ${x === todayStr() ? 'today' : ''}" style="min-height:52px"><div class="dn">${parseYmd(x).getDate()}</div>${mk}</div>`;
    }
  }
  const comp = `<tr><td>Score</td><td>${sc == null ? '–' : sc + ' %'}</td><td>${sp.score == null ? '–' : sp.score + ' %'}</td><td>${delta(sc, sp.score, ' pts')}</td></tr>
    <tr><td>Temps réalisé (blocs)</td><td>${fmtDur(st.realMin)}</td><td>${fmtDur(sp.realMin)}</td><td>${delta(st.realMin, sp.realMin, ' min')}</td></tr>
    <tr><td>Régularité</td><td>${st.regularity == null ? '–' : Math.round(st.regularity * 100) + ' %'}</td><td>${sp.regularity == null ? '–' : Math.round(sp.regularity * 100) + ' %'}</td><td>${delta(st.regularity == null ? null : st.regularity * 100, sp.regularity == null ? null : sp.regularity * 100, ' pts')}</td></tr>
    <tr><td>Activités reportées</td><td>${cnt.postponed || 0}</td><td>${sp.cnt.postponed || 0}</td><td>${delta(-(cnt.postponed || 0), -(sp.cnt.postponed || 0))}</td></tr>`;
  const sdet = kind === 'day' ? dayInfo(p.from, qf) : null;
  return pageTop('📊 Statistiques & scores', 'Un seul jeu de filtres : tous les chiffres et graphiques sont recalculés sur le même périmètre', `<button class="btn" ${A('goBilan', { k: kind === 'month' ? 'week' : kind })}>📑 Bilan détaillé</button><button class="btn pri" ${A('expOpen', {})}>⬇ Exporter…</button><button class="btn" data-act="print">🖨 Imprimer</button>`) +
    `<div class="card" style="margin-bottom:14px"><div class="fr" style="margin:0"><div class="tabs" style="margin:0">${[['day', 'Jour'], ['week', 'Semaine'], ['month', 'Mois']].map(([k, l]) => `<button class="${kind === k ? 'on' : ''}" ${A('statP', { v: k })}>${l}</button>`).join('')}</div><div class="calbar"><button class="btn sm" ${A('statNav', { n: -step })}>‹</button><b class="ct" style="min-width:200px">${periodLabel(p)}</b><button class="btn sm" ${A('statNav', { n: step })}>›</button><button class="btn sm" ${A('statToday')}>Aujourd’hui</button></div><label>Domaine / quota<select data-live="stq" name="q"><option value="all">Tous les quotas</option>${catOptions(qf)}</select></label>${qf !== 'all' ? `<button class="btn sm" ${A('statQreset')}>✕ Réinitialiser le filtre</button>` : ''}</div></div>
    <div class="g g4">
      <div class="card kpi">${ring((sc || 0) / 100, { size: 84, label: sc == null ? '–' : sc + '%', color: `var(--${sc == null ? 'mut' : sc >= 80 ? 'ok' : sc >= 50 ? 'warn' : 'bad'})` })}<div><div class="l">Score ${kind === 'day' ? 'du jour' : kind === 'week' ? 'de la semaine' : 'du mois'} ${infoBtn(kind, date)}</div><div>${delta(sc, sp.score, ' pts')} <span class="rt">vs précédent</span></div></div></div>
      <div class="card"><div class="l rt">Réalisé / prévu (blocs terminés)</div><div class="v big">${fmtDur(st.realMin)}</div><div class="rt">sur ${fmtDur(st.plannedMin)} prévus · écart ${fmtDur(st.realMin - st.plannedMin)}</div></div>
      <div class="card"><div class="l rt">Régularité (blocs faits / traités)</div><div class="v big">${st.regularity == null ? '–' : Math.round(st.regularity * 100) + ' %'}</div><div class="rt">${(cnt.done || 0)} faits · ${cnt.partial || 0} partiels · ${cnt.missed || 0} non faits</div></div>
      <div class="card"><div class="l rt">Report & à qualifier</div><div class="v big">${st.reportRate == null ? '–' : Math.round(st.reportRate * 100) + ' %'}</div><div class="rt">${cnt.postponed || 0} reporté(s) · ${pend} non renseigné(s)/à venir</div></div>
    </div>
    ${sdet ? `<div class="card" style="margin-bottom:14px"><div class="ch"><h2>Détail du score du jour</h2></div>${sdet.comps.length ? sdet.comps.map(c => `<div class="ln"><div class="lb2"><b>${esc(c.k)}</b><div class="rt">${esc(c.d)}</div></div><div style="min-width:120px"><div class="bar"><i style="width:${c.v * 100}%"></i></div></div><b>${Math.round(c.v * 100)}%</b></div>`).join('') : '<div class="empty">Pas de données pour calculer un score (jour non renseigné ou futur).</div>'}</div>` : ''}
    <div class="g g2">
      <div class="card span2"><div class="ch"><h2>Quotas — réalisé vs cible (${kind === 'day' ? 'jour' : kind === 'week' ? 'semaine' : 'mois, proratisé'})</h2></div><div class="tw"><table class="rs"><thead><tr><th>Quota</th><th>Réalisé</th><th>Cible</th><th></th><th>Taux</th></tr></thead><tbody>${perRows}</tbody></table></div></div>
      ${kind !== 'day' ? `<div class="card"><div class="ch"><h2>${q1 ? esc(q1.label) + ' par jour' : 'Activité par jour (heures)'}</h2></div><div class="tw">${barChart(dailyItems, { target: tgt, fmt: v => q1 && q1.kind === 'count' ? v : (Math.round(v * 10) / 10) + (q1 && q1.kind === 'count' ? '' : 'h'), minW: kind === 'month' ? 22 : 40 })}</div></div>` : ''}
      <div class="card"><div class="ch"><h2>Répartition du temps</h2></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(dist)}<div class="lg" style="flex-direction:column;margin:0">${dist.map(x => `<span><i style="background:${x.c}"></i>${esc(x.l)} — ${fmtDur(x.v)}</span>`).join('')}</div></div><div class="rt" style="margin-top:6px">Hors sommeil et café (qui chevauche les autres activités).</div></div>
      <div class="card"><div class="ch"><h2>Évolution du score (8 semaines)</h2></div><div class="tw">${lineChart(wk)}</div></div>
      <div class="card"><div class="ch"><h2>Calendrier de régularité (15 semaines)</h2></div><div class="tw">${heat(hmap, hFrom, todayStr(), q1 ? q1.color : 'var(--p2)')}</div><div class="rt" style="margin-top:6px">Plus la case est foncée, plus l’objectif du jour est atteint. Case vide = non renseigné.</div></div>
      ${kind === 'month' ? `<div class="card"><div class="ch"><h2>Mois en un coup d’œil ✓ / ✗</h2></div><div class="mg">${mgrid}</div></div>` : ''}
      <div class="card"><div class="ch"><h2>Causes des écarts</h2></div>${reasons.length ? `<div class="tw">${barChart(reasons, { showAvg: false, h: 160, minW: 70 })}</div>` : '<div class="empty">Aucune cause renseignée sur la période.</div>'}</div>
      <div class="card span2"><div class="ch"><h2>Comparaison avec la période précédente</h2></div><div class="tw"><table><thead><tr><th>Indicateur</th><th>Actuel</th><th>Précédent</th><th>Évolution</th></tr></thead><tbody>${comp}</tbody></table></div></div>

    </div>`;
}

/* ---------- BILAN (jour / semaine) ---------- */
function weekReportText(ws) {
  const wi = weekInfo(ws), we = addDays(ws, 6);
  let t = `BILAN DE LA SEMAINE ${fmtShort(ws)} → ${fmtShort(we)}\nScore : ${wi.score == null ? '–' : wi.score + ' %'}\n\n`;
  wi.rows.forEach(r => { t += `${r.q.icon} ${r.q.label} : ${fmtVal(r.q, r.done)} / ${r.q.mode === 'max' ? 'max ' : ''}${fmtVal(r.q, r.target)} → ${r.reached ? 'OBJECTIF ATTEINT' : r.q.mode === 'max' ? 'PLAFOND DÉPASSÉ' : 'NON ATTEINT'}\n`; });
  const miss = S.blocks.filter(b => b.date >= ws && b.date <= we && b.q && ['missed', 'partial', 'postponed', 'unfilled'].includes(effStatus(b)));
  if (miss.length) t += `\nTâches non faites / partielles :\n` + miss.map(b => `- ${fmtShort(b.date)} ${b.start} ${b.title} (${STATUS[effStatus(b)][0]})${b.reason ? ' — ' + b.reason : ''}`).join('\n');
  return t;
}
function vBilan() {
  const kind = UI.bilanKind, date = UI.bilanDate || todayStr();
  if (kind === 'day') {
    const di = dayInfo(date), rv = S.reviews[date] || {}, bl = S.blocks.filter(b => b.date === date && b.status !== 'cancelled').sort((a, b) => a.start.localeCompare(b.start));
    return pageTop(`🌙 Bilan du ${fmtDate(date)}`, rv.closed ? 'Bilan clôturé' : 'Bilan non clôturé', `<button class="btn" ${A('go', { tab: 'cockpit' })}>‹ Retour</button><button class="btn pri" ${A('bilan', { date })}>Faire / modifier le bilan</button>`) +
      `<div class="g g2"><div class="card kpi">${ring((di.score || 0) / 100, { size: 90, label: di.score == null ? '–' : di.score + '%' })}<div><div class="l">Score du jour ${infoBtn('day', date)}</div>${di.comps.map(c => `<div class="rt">${esc(c.k)} : ${esc(c.d)}</div>`).join('')}</div></div><div class="card"><h2>Humeur & énergie</h2><div class="big">${rv.mood ? ['😞', '😕', '😐', '🙂', '😄'][rv.mood - 1] : '–'} <span class="rt">énergie ${rv.energy || '–'}/5</span></div><div style="white-space:pre-wrap">${esc(rv.note || '')}</div></div></div><div class="card"><div class="ch"><h2>Activités</h2></div>${bl.length ? bl.map(blockRow).join('') : '<div class="empty">Aucune activité</div>'}</div>`;
  }
  const ws = weekStartOf(date), we = addDays(ws, 6), wi = weekInfo(ws), t = todayStr();
  const miss = S.blocks.filter(b => b.date >= ws && b.date <= we && b.q && ['missed', 'partial', 'postponed', 'unfilled'].includes(effStatus(b))).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const st = statsFor(periodOf('week', date));
  const days = [...Array(7)].map((_, i) => { const d = addDays(ws, i); return { l: DAYS[i], v: dayInfo(d).score || 0, dim: d > t }; });
  const recos = [];
  wi.rows.forEach(r => {
    if (r.q.mode === 'min' && !r.reached) recos.push(`${r.q.icon} ${r.q.label} : ${fmtVal(r.q, r.done)} sur ${fmtVal(r.q, r.target)} (${Math.round(r.pct * 100)} %). Option : garder la cible et placer un rattrapage la semaine prochaine, ou la baisser temporairement — à ta décision.`);
    if (r.q.mode === 'max' && !r.reached) recos.push(`${r.q.icon} ${r.q.label} : ${fmtVal(r.q, r.done)} pour un plafond de ${fmtVal(r.q, r.target)}. Repère les jours/circonstances qui poussent à dépasser (voir Journal) et fixe une règle simple pour la semaine suivante.`);
  });
  if (!recos.length) recos.push('Tous les objectifs de la semaine sont tenus. Bravo — pense à protéger ton repos.');
  const top = st.reasons && Object.entries(st.reasons).sort((a, b) => b[1] - a[1])[0];
  if (top) recos.push(`Cause la plus fréquente des écarts : « ${top[0]} » (${top[1]} fois).`);
  return pageTop(`📑 Bilan de la semaine`, `${fmtShort(ws)} → ${fmtShort(we)}`, `<button class="btn" ${A('bilanNav', { n: -7 })}>‹</button><button class="btn" ${A('bilanNav', { n: 7 })}>›</button><button class="btn" ${A('copyReport', { ws })}>📋 Copier</button><button class="btn" data-act="print">🖨 PDF</button><button class="btn pri" ${A('wbDone', { ws })}>✔ Marquer comme lu</button>`) +
    `<div class="g g2"><div class="card kpi">${ring((wi.score || 0) / 100, { size: 96, label: wi.score == null ? '–' : wi.score + '%' })}<div><div class="l">Score de la semaine ${infoBtn('week', ws)}</div><div class="rt">${wi.rows.filter(r => r.reached).length}/${wi.rows.length} objectifs tenus</div></div></div><div class="card"><div class="ch"><h2>Score par jour</h2></div><div class="tw">${barChart(days, { h: 140, showAvg: false, fmt: v => v + '%', minW: 44 })}</div></div></div>
    <div class="card" style="margin-bottom:14px"><div class="ch"><h2>Objectifs : atteints ou non ?</h2></div><div class="tw"><table class="rs"><thead><tr><th>Quota</th><th>Réalisé</th><th>Cible</th><th>%</th><th>Verdict</th></tr></thead><tbody>${wi.rows.map(r => `<tr><td data-l="Quota">${r.q.icon} ${esc(r.q.label)}</td><td data-l="Réalisé"><b>${fmtVal(r.q, r.done)}</b></td><td data-l="Cible">${r.q.mode === 'max' ? 'max ' : ''}${fmtVal(r.q, r.target)}</td><td data-l="%">${Math.round(r.pct * 100)} %</td><td data-l="Verdict"><span class="chip ${r.reached ? 'ok' : 'bad'}">${r.reached ? (r.q.mode === 'max' ? '✔ Plafond respecté' : '✔ Objectif atteint') : (r.q.mode === 'max' ? '✘ Plafond dépassé' : '✘ Non atteint')}</span></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card" style="margin-bottom:14px"><div class="ch"><h2>Tâches non faites, partielles ou reportées</h2></div>${miss.length ? miss.map(b => `<div class="ln"><div class="lt">${fmtShort(b.date)}<br>${b.start}</div><div class="lb2"><b>${qLabel(b.q)} — ${esc(b.title)}</b> ${stChip(effStatus(b))}<div class="rt">${b.reason ? esc(b.reason) : 'cause non renseignée'}${b.note ? ' — ' + esc(b.note) : ''}</div></div>${['unfilled', 'missed', 'partial'].includes(effStatus(b)) ? `<button class="btn sm" ${A('qualify', { id: b.id })}>Corriger</button><button class="btn sm" ${A('replan', { id: b.id })}>Reporter</button>` : ''}</div>`).join('') : '<div class="empty">Aucune tâche manquée cette semaine 🎉</div>'}</div>
    <div class="card"><div class="ch"><h2>💡 Recommandations (sans pression)</h2></div>${recos.map(r => `<div class="al info"><div class="ai">💡</div><div class="ax" style="color:var(--tx)">${esc(r)}</div></div>`).join('')}</div>`;
}

  if (p.kind === 'month') { const d = parseYmd(p.from); return `${capF(MONTHS[d.getMonth()])} ${d.getFullYear()}`; }

  const ds = [todayStr()]; for (const e of S.entries) ds.push(e.date); for (const b of S.blocks) ds.push(b.date); for (const l of S.libre) ds.push(l.date); for (const a of S.appts) ds.push(a.date);

  const sp = p.kind === 'range' ? null : statsFor(prevPeriod(p, o.date), qf);

  const quotas = st.per.map(r => { const s = qStatus(r); return { q: r.q, done: r.done, target: r.target, pct: r.pct, ppct: r.ppct, status: s[0], tone: s[1] }; });
  const blocks = S.blocks.filter(b => inP(b.date) && b.status !== 'cancelled' && (qf === 'all' || b.q === qf))
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
    .map(b => { const s = effStatus(b), pl = blockPlanned(b); const ac = ['done', 'partial', 'missed', 'postponed'].includes(s) ? Math.min(pl, blockActual(b) || (s === 'done' ? pl : 0)) : 0; return { b, s, pl, ac, q: b.q ? Q(b.q) : null }; });

  const entries = S.entries.filter(e => inP(e.date) && (qf === 'all' || e.cat === qf)).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

    if (r.q.mode === 'max' && r.done > r.target) reco.push(`${r.q.label} : plafond dépassé (${fmtVal(r.q, r.done)} pour un maximum de ${fmtTarget(r.q, r.target)}). Fixer une limite horaire ou un remplacement.`);

async function voxLoad() {

async function voxStart() {
  if (VX.rec) return;
  if (storageMode !== 'idb') return toast('Stockage indisponible : les vocaux ne peuvent pas être gardés ici.', 'bad');
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Ce navigateur ne sait pas enregistrer le son.', 'bad');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast('Micro refusé : autorise le micro pour ce site dans le navigateur.', 'bad', 6000); }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  let mr; const chunks = [];
  try { mr = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined); } catch (e) { stream.getTracks().forEach(t => t.stop()); return toast('Enregistrement audio non supporté sur ce navigateur.', 'bad'); }
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const rec = { mr, stream, chunks, t0: Date.now(), date: todayStr(), time: min2hm(nowMin()), cancel: false, mime: mr.mimeType || mt || 'audio/webm' };
  rec.timer = setInterval(() => { const el = $('#vtime'); const s = (Date.now() - rec.t0) / 1000; if (el) el.textContent = fmtSec(s); if (s >= 600) voxStop(); }, 400);
  mr.onstop = () => voxFinish(rec);
  VX.rec = rec; mr.start(1000);
  if (UI.tab !== 'voice') { UI.tab = 'voice'; }
  render(false);
}
function voxStop(cancel) { const r = VX.rec; if (!r) return; r.cancel = !!cancel; try { r.mr.state !== 'inactive' && r.mr.stop(); } catch (e) { voxFinish(r); } }
async function voxFinish(rec) {
  clearInterval(rec.timer); try { rec.stream.getTracks().forEach(t => t.stop()); } catch (e) { }
  if (VX.rec !== rec) return; VX.rec = null;
  const dur = (Date.now() - rec.t0) / 1000, blob = new Blob(rec.chunks, { type: rec.mime });
  if (rec.cancel) { toast('Enregistrement annulé'); return render(false); }
  if (blob.size < 400) { toast('Vocal vide : rien n’a été enregistré.', 'warn'); return render(false); }
  const m = { id: uid(), ts: rec.t0, date: rec.date, time: rec.time, dur, status: 'new', title: '', mime: rec.mime, size: blob.size, treated: null };
  try { await DB.set('vox:' + m.id, blob); VX.list.push(m); await voxSaveMeta(); toast('🎙️ Vocal enregistré', 'good'); }
  catch (e) { VX.list = VX.list.filter(x => x.id !== m.id); try { await DB.del('vox:' + m.id); } catch (_) { } toast('Impossible de sauvegarder le vocal (espace plein ?).', 'bad'); }
  UI.vf = 'new'; render(false);
}

function vVoice() {

function toggleOutcome(f) {

  $('#q-why', f).classList.toggle('hide', o === 'done' || o === 'cancelled');

}
function recordDone(b, addMin, countUnit) {
  const q = Q(b.q); if (!q) return;
  if (q.kind === 'duration') { if (addMin > 0) addEntry({ cat: q.id, v: addMin, date: b.date, time: b.end, blockId: b.id, src: 'bloc' }); }
  else {
    const ex = S.entries.find(e => e.blockId === b.id && e.v > 0);
    if (ex) ex.mins = (ex.mins || 0) + addMin;
    else addEntry({ cat: q.id, v: countUnit ? 1 : 0, mins: addMin, date: b.date, time: b.end, blockId: b.id, src: 'bloc' });
  }
}

/* ---------- report assisté (DEC-01 : jamais sans validation) ---------- */
function consequenceText(b, slot, dur) {
  const q = Q(b.q); if (!q) return '';
  const ws = weekStartOf(todayStr()), we = addDays(ws, 6), r = weekProgress(q, ws);
  if (slot.date > we) return `Ce créneau est la semaine prochaine : cette semaine, ${q.label} restera à ${fmtVal(q, r.done + r.plannedFut)} sur ${fmtVal(q, q.week)}.`;
  const tot = r.done + r.plannedFut + (q.kind === 'duration' ? dur : 1);
  return tot >= q.week ? `Avec ce créneau, ${q.label} atteint son objectif de la semaine (${fmtVal(q, Math.min(tot, q.week))} / ${fmtVal(q, q.week)}).` : `Après ce report, ${q.label} sera planifié à ${fmtVal(q, tot)} sur ${fmtVal(q, q.week)} cette semaine (il manquera encore ${fmtVal(q, q.week - tot)}).`;
}
function replanModal(id, opts = {}) {

function applyReplan(id, date, start, dur, mark) {
  const b = S.blocks.find(x => x.id === id); if (!b) return;
  if (!(dur > 0) || hm2min(start) + dur > 1440) return toast('Durée ou heure invalide : le bloc doit tenir dans la journée (durée > 0).', 'warn');
  if (S.blocks.some(x => x.rescheduledFrom === id && x.status !== 'cancelled')) return toast('Ce bloc a déjà été reporté.', 'warn');
  const nb = { id: uid(), date, start, end: min2hm(hm2min(start) + dur), title: b.title, q: b.q, status: 'planned', fixed: false, note: b.note || '', rescheduledFrom: b.id };
  S.blocks.push(nb);

  S.proposals.push({ id: uid(), ts: Date.now(), kind: 'report', q: b.q, text: `${b.title} : ${fmtShort(b.date)} ${b.start} → ${fmtShort(date)} ${start} (${fmtDur(dur)})`, decision: 'accepté' });

}

/* ---------- chronomètre ---------- */
function timerStartFor(id) {

}

/* ---------- démo ---------- */
function loadDemo() {
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = todayStr(), start = addDays(weekStartOf(t), -28);
  const tpl = { 0: [['revision', '18:45', '20:15'], ['freelance', '20:30', '22:30']], 1: [['sport', '18:30', '20:30'], ['apprentissage', '21:00', '22:00']], 2: [['revision', '18:45', '20:15'], ['freelance', '20:30', '22:30']], 3: [['revision', '18:45', '20:15'], ['apprentissage', '20:30', '21:30']], 4: [['sport', '18:30', '20:30'], ['freelance', '21:00', '22:30']], 5: [['freelance', '10:00', '14:00'], ['sport', '16:00', '18:00'], ['apprentissage', '20:00', '21:30']], 6: [['revision', '10:00', '12:00'], ['freelance', '14:00', '18:00']] };
  const reasonsL = S.reasons;
  for (let d = start; d <= addDays(weekStartOf(t), 6); d = addDays(d, 1)) {
    const i = dow(d), past = d < t;
    if (i < 5) S.blocks.push({ id: uid(), demo: 1, date: d, start: '08:30', end: '17:00', title: 'Travail', q: null, status: 'done', fixed: true });
    for (const [qid, s, e] of tpl[i]) {
      const q = Q(qid), b = { id: uid(), demo: 1, date: d, start: s, end: e, title: q.label, q: qid, status: 'planned', fixed: false }, p = blockPlanned(b);
      S.blocks.push(b);
      if (!past) continue;
      const r = rnd();
      if (r < .72) { b.status = 'done'; const a = Math.round(p * (0.9 + rnd() * .2)); S.entries.push({ id: uid(), demo: 1, date: d, time: e, cat: qid, v: q.kind === 'duration' ? a : 1, mins: q.kind === 'count' ? a : 0, blockId: b.id, src: 'bloc', note: '', ts: Date.now() }); }
      else if (r < .85) { b.status = 'partial'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; const a = Math.round(p * .5); S.entries.push({ id: uid(), demo: 1, date: d, time: e, cat: qid, v: q.kind === 'duration' ? a : 0, mins: q.kind === 'count' ? a : 0, blockId: b.id, src: 'bloc', note: '', ts: Date.now() }); }
      else if (r < .95) { b.status = 'missed'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; }
      else { b.status = 'postponed'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; }
    }
    if (past) {
      const n = 12 + Math.floor(rnd() * 12); for (let k = 0; k < n; k++) S.entries.push({ id: uid(), demo: 1, date: d, time: min2hm(480 + Math.floor(k * 60 + rnd() * 20)), cat: 'cigarette', v: 1, src: 'manual', note: '', ts: Date.now() });
      S.entries.push({ id: uid(), demo: 1, date: d, time: '06:30', cat: 'sommeil', v: 330 + Math.floor(rnd() * 150), src: 'manual', note: '23:00 → 06:30', ts: Date.now() });
      PRAYERS.forEach(p => { if (rnd() < .82) S.entries.push({ id: uid(), demo: 1, date: d, time: '12:00', cat: 'priere', sub: p, v: 1, src: 'manual', note: '', ts: Date.now() }); });
      if (rnd() < .5) S.entries.push({ id: uid(), demo: 1, date: d, time: '15:00', cat: 'cafe', v: 60 + Math.floor(rnd() * 120), src: 'manual', note: 'café + travail', ts: Date.now() });
      S.reviews[d] = { closed: true, ts: Date.now(), mood: 2 + Math.floor(rnd() * 4), energy: 2 + Math.floor(rnd() * 4), note: rnd() < .3 ? 'Journée chargée au bureau, fatigue en fin de soirée.' : '', demo: 1 };
    }
  }
  S.appts.push({ id: uid(), demo: 1, title: 'Rendez-vous banque', date: addDays(t, 1), time: '10:00', dur: 60, place: 'Agence centre-ville', note: '', done: false });
  S.appts.push({ id: uid(), demo: 1, title: 'Client SGC — appel', date: addDays(t, 3), time: '17:30', dur: 30, place: '', note: '', done: false });
  S.libre.push({ id: uid(), demo: 1, date: addDays(t, -1), from: '15:00', to: '17:00', text: 'Hammam', cat: '' });
  log('démo', 'Données de démonstration chargées'); save();
}

      } catch (e) { }
    };
  } catch (e) { }
}

function openReminders(force) {
  if (window.__NOREM) return;
  if ($('#modal') || (!force && UI.remAt && Date.now() - UI.remAt < 180000)) return;
  const al = alerts().filter(a => a.lvl === 'danger' || a.lvl === 'warn').sort((a, b) => lvlOrder[a.lvl] - lvlOrder[b.lvl]).slice(0, 6); if (!al.length) return;
  UI.remAt = Date.now();
  const now = Date.now(); al.forEach(a => { S.notified[a.key] = now; });
  modal(`<h2>🔔 Rappels</h2><div style="display:grid;gap:8px;margin-top:6px">${al.map(a => `<div class="card" style="padding:12px;margin:0"><div><b>${a.icon} ${esc(a.title)}</b></div><div class="rt">${esc(a.text || '')}</div>${(a.acts || []).length ? `<div class="fbtns" style="margin-top:8px">${a.acts.map(x => { const { l, act, ...rest } = x; return `<button class="btn sm" ${A(act, rest)}>${l}</button>`; }).join('')}</div>` : ''}</div>`).join('')}</div><div class="fbtns" style="margin-top:12px"><button class="btn pri" ${A('mclose')}>OK, j’ai vu</button></div>`);
  save();

function checkNotify() {
  const al = alerts().filter(a => a.notify); let shown = 0; const now = Date.now();
  for (const a of al) { if (S.notified[a.key]) continue; S.notified[a.key] = now; if (shown < 3) { toast(`${a.icon} <b>${esc(a.title)}</b><br><span class="rt">${esc(a.text)}</span>`, a.lvl === 'danger' ? 'danger' : 'warn', 7000); notify(a.title, a.text); shown++; } }
  for (const k of Object.keys(S.notified)) if (now - S.notified[k] > 3 * 864e5) delete S.notified[k];
  if (shown) save();
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Life Pilot</title>
<meta name="theme-color" content="#2D348B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--p:#2D348B;--p2:#5560d8;--bg:#eceffb;--bg2:#d9def5;--card:rgba(255,255,255,.74);--cardsolid:#fff;--cb:rgba(45,52,139,.13);--tx:#151938;--mut:#596090;--ok:#1d9b62;--warn:#dd9200;--bad:#d4314a;--sh:0 8px 28px rgba(45,52,139,.11);--r:18px;--soft:rgba(45,52,139,.07)}
[data-th=dark]{--bg:#0b0d1c;--bg2:#12163a;--card:rgba(27,31,66,.66);--cardsolid:#1b1f42;--cb:rgba(140,150,255,.17);--tx:#eceefc;--mut:#9ba2d3;--sh:0 8px 28px rgba(0,0,0,.42);--soft:rgba(140,150,255,.09);--p:#6f7af0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);background:radial-gradient(1100px 600px at 8% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(85,96,216,.16),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.45rem}h2{font-size:1.1rem}h3{font-size:.98rem}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card);backdrop-filter:blur(18px);border-right:1px solid var(--cb)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;padding:6px 8px 14px;color:var(--tx)}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-style:normal;box-shadow:0 6px 16px rgba(45,52,139,.4)}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;width:100%;color:var(--mut);font-weight:600}
.nv:hover{background:var(--soft)}
.nv.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(45,52,139,.32)}
.nv b{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px}
.main{padding:20px 22px 110px;max-width:1300px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top .sp{flex:1}
.thbtn,.syb{gap:5px}.syb.bad{background:var(--bad);color:#fff}.thl{font-size:.78rem}@media(max-width:700px){.thl{display:none}}
.sub{color:var(--mut);font-size:.88rem}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--cb);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card>h2,.card>.ch{margin-bottom:10px}
.ch{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.g{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.btn{border:1px solid var(--cb);background:var(--cardsolid);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;box-shadow:0 6px 16px rgba(45,52,139,.3)}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn.ic{padding:6px 9px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.ok{background:rgba(29,155,98,.15);color:var(--ok)}.chip.warn{background:rgba(221,146,0,.17);color:var(--warn)}.chip.bad{background:rgba(212,49,74,.15);color:var(--bad)}.chip.p{background:rgba(85,96,216,.16);color:var(--p)}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .v{font-size:1.7rem;font-weight:800;line-height:1}
.kpi .l{font-size:.8rem;color:var(--mut);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;cursor:pointer;border:1px solid transparent;background:var(--soft)}
.sd.today{border-color:var(--p);background:rgba(85,96,216,.14)}
.sd small{font-weight:700;color:var(--mut);font-size:.7rem}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;background:#8a90b8}
.dot.s3{background:var(--ok)}.dot.s2{background:var(--warn)}.dot.s1{background:var(--bad)}.dot.s0{background:transparent;border:2px dashed var(--mut);color:var(--mut)}
.hab{--c:#4f5bd5;--pct:0%;border-radius:18px;padding:13px 15px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--c) var(--pct),color-mix(in srgb,var(--c) 38%,#12142b) var(--pct));box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;overflow:hidden}
.hab .hi{font-size:1.5rem;width:38px;text-align:center}
.hab .hn{font-weight:800;line-height:1.15}
.hab .hs{font-size:.84rem;opacity:.92}
.hab .hr{margin-left:auto;text-align:right;font-size:.74rem;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.hab .tag{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 9px}
.hab.over{outline:3px solid var(--bad)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--p2)}
.al{display:flex;gap:11px;padding:11px 12px;border-radius:14px;margin-bottom:8px;background:var(--soft);border-left:5px solid var(--mut)}
.al.danger{border-color:var(--bad);background:rgba(212,49,74,.1)}.al.warn{border-color:var(--warn);background:rgba(221,146,0,.1)}.al.info{border-color:var(--p2);background:rgba(85,96,216,.1)}.al.good{border-color:var(--ok);background:rgba(29,155,98,.1)}
.al .ai{font-size:1.2rem}.al .at{font-weight:700}.al .ax{font-size:.86rem;color:var(--mut)}.al .aa{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cnt{display:flex;align-items:center;gap:10px}
.cnt .n{font-size:2rem;font-weight:800;min-width:2.2ch;text-align:center}
.cnt .rb{width:44px;height:44px;border-radius:50%;font-size:1.4rem;font-weight:800;border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;cursor:pointer}
.cnt .rb.m{background:var(--soft);color:var(--tx)}
.pr{display:flex;gap:7px;flex-wrap:wrap}
.pr button{flex:1;min-width:58px;padding:9px 4px;border-radius:13px;border:1px solid var(--cb);background:var(--soft);cursor:pointer;font-weight:700;font-size:.8rem}
.pr button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--cb);background:var(--soft);padding:6px 13px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.84rem;color:var(--mut)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.fr{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.fr label,.fm label{display:flex;flex-direction:column;gap:3px;font-size:.76rem;font-weight:700;color:var(--mut)}
input,select,textarea{background:var(--cardsolid);border:1px solid var(--cb);border-radius:11px;padding:8px 10px;min-width:0;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2)}
textarea{resize:vertical;min-height:70px}
.fm{display:grid;gap:11px}
.fm .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;color:var(--mut);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--cb)}
td{padding:8px;border-bottom:1px solid var(--cb);vertical-align:top}
tr:hover td{background:var(--soft)}
.tw{overflow-x:auto}
.mod{position:fixed;inset:0;background:rgba(8,10,30,.55);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:14px;overflow:auto}
.mbox{background:var(--cardsolid);border:1px solid var(--cb);border-radius:22px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.mbox.wide{width:min(780px,100%)}
.mbox .x{position:absolute;right:12px;top:10px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer}
.mbox h2{margin-bottom:12px;padding-right:34px}
.toasts{position:fixed;top:12px;right:12px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 24px))}
.toast{background:var(--cardsolid);border:1px solid var(--cb);border-left:5px solid var(--p2);padding:11px 14px;border-radius:13px;box-shadow:var(--sh);animation:in .25s}
.toast.danger{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.good{border-left-color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cardsolid);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--cb);padding:6px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));gap:2px;justify-content:space-between;box-sizing:border-box;width:100%}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.68rem;line-height:1.15;font-weight:700;color:var(--mut);padding:5px 2px;border-radius:12px;cursor:pointer;position:relative;flex:1 1 0;min-width:0;min-height:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit}
.bnav button span{font-size:1.25rem}.bnav button.on{color:var(--p);background:var(--soft)}
.bnav b{position:absolute;top:1px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px}
.fab{position:fixed;right:18px;bottom:24px;z-index:35;width:58px;height:58px;border-radius:50%;border:0;font-size:1.9rem;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 10px 26px rgba(45,52,139,.5);cursor:pointer}
.tmb{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:36;background:#12163a;color:#fff;border-radius:99px;padding:9px 12px 9px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;max-width:calc(100vw - 100px)}
.tmb .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}
.tmb.over{background:var(--bad)}
.cal{display:grid;grid-template-columns:48px repeat(var(--n),1fr);gap:0;position:relative}
.cal .hc{position:relative}
.cal .hc span{position:absolute;right:6px;font-size:.7rem;color:var(--mut);transform:translateY(-50%)}
.cal .dc{position:relative;border-left:1px solid var(--cb);cursor:cell;background-image:linear-gradient(var(--cb) 1px,transparent 1px);background-size:100% calc(var(--sc) * 60px)}
.calbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ct{min-width:170px;text-align:center}
.cdh{position:sticky;top:0;background:var(--cardsolid);z-index:3;text-align:center;font-weight:800;padding:6px 2px;border-bottom:1px solid var(--cb);font-size:.8rem}
.cdh.today{color:var(--p)}
.blk{--c:#4f5bd5;position:absolute;border-radius:10px;padding:3px 7px;color:#fff;font-size:.76rem;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 75%,#000));border:1px solid rgba(255,255,255,.25);box-shadow:0 3px 8px rgba(0,0,0,.2);line-height:1.2}
.blk b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.st-done{opacity:.72}.blk.st-missed,.blk.st-cancelled,.blk.st-postponed{opacity:.5;text-decoration:line-through}
.blk.st-unfilled{outline:2px dashed var(--warn);outline-offset:-2px}
.blk.fx{background:repeating-linear-gradient(135deg,#6d7399,#6d7399 6px,#5d6388 6px,#5d6388 12px)}
.blk.ap{background:linear-gradient(180deg,#f0a30a,#c98100)}
.blk.lb{background:linear-gradient(180deg,#8a63d2,#6a46b0)}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}.nowl:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mc{min-height:74px;border-radius:12px;padding:5px 6px;background:var(--soft);cursor:pointer;border:1px solid transparent;display:flex;flex-direction:column;gap:2px;font-size:.74rem}
.mc.today{border-color:var(--p)}.mc.out{opacity:.4}
.mc .dn{font-weight:800;font-size:.84rem}
.mk{font-size:1.3rem;font-weight:800;text-align:center}
.mk.y{color:var(--ok)}.mk.n{color:var(--bad)}.mk.q{color:var(--warn)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px}
.hm i{width:14px;height:14px;border-radius:4px;background:var(--soft);display:block}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--cb)}.ln:last-child{border:0}
.ln .lt{min-width:62px;font-weight:700;font-size:.82rem;color:var(--mut)}
.ln .lb2{flex:1;min-width:0}
.rg{display:flex;gap:7px;flex-wrap:wrap}.rg label{display:flex;gap:6px;align-items:center;background:var(--soft);padding:7px 11px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.84rem;color:var(--tx)}
.rg input{accent-color:var(--p2)}
svg text{fill:var(--mut);font-family:inherit}
.hide{display:none!important}
.rt{font-size:.8rem;color:var(--mut)}
.big{font-size:2.4rem;font-weight:800}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
@media(min-width:1180px){.span2{grid-column:span 2}}
.kpi{flex-wrap:wrap}
@media(max-width:899px){
 .g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:1.35rem}.big{font-size:1.8rem}.card{padding:13px}
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}.bnav{display:flex}
 html,body{overflow-x:hidden;max-width:100vw}
 .main{padding:14px 12px calc(150px + env(safe-area-inset-bottom));min-width:0}
 .g>*,.top>*,.card{min-width:0;max-width:100%}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .top{gap:8px}.top>div:first-child{flex:1 1 calc(100% - 64px)}.top .sp{display:none}.thbtn{order:-1}
 .fab{bottom:calc(78px + env(safe-area-inset-bottom));right:14px;width:54px;height:54px;font-size:1.7rem}
 .tmb{bottom:calc(80px + env(safe-area-inset-bottom));max-width:calc(100vw - 90px)}
 input,select,textarea{font-size:16px}
 .ct,.ct[style]{min-width:0!important;flex:1 1 120px}.calbar{width:100%;justify-content:space-between}
 .tw .cal[style*="--n:7"]{min-width:620px}
 .toasts{top:8px}
 h1{font-size:1.25rem}
 .mc{min-height:58px}
 .tw table.rs thead{display:none}
 .tw table.rs tr{display:block;border-bottom:1px solid var(--cb);padding:6px 0}
 .tw table.rs td{display:flex;gap:8px;border:0;padding:2px 4px}
 .tw table.rs td:before{content:attr(data-l);font-weight:700;color:var(--mut);min-width:68px;font-size:.74rem}
}
body.kb .bnav,body.kb .fab,body.kb .tmb{display:none!important}
button,.btn,a,.nv{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media print{.side,.bnav,.fab,.tmb,.top .btn,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ccc;backdrop-filter:none;background:#fff;break-inside:avoid}.main{padding:0}}
</style>

<body>
<div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div>
<nav class="bnav" id="bnav"></nav>
<div class="toasts" id="toasts"></div>
<div id="tbar"></div>
<script>
'use strict';
/* ================= My Life Pilot V0.3.1 — noyau : utilitaires, stockage, calculs ================= */
const VERSION = '0.4.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const NOWFN = () => (window.__NOW ? new Date(window.__NOW) : new Date());
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const todayStr = () => ymd(NOWFN());
const nowMin = () => { const d = NOWFN(); return d.getHours() * 60 + d.getMinutes(); };
const hm2min = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const min2hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const fmtDur = m => { m = Math.round(m); if (m < 0) return '-' + fmtDur(-m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? pad(r) : ''}` : `${r} min`; };
const dow = s => (parseYmd(s).getDay() + 6) % 7;
const weekStartOf = s => addDays(s, -dow(s));
const monthRange = s => { const d = parseYmd(s); return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; };
const DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const DAYSL = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const fmtDate = s => { const d = parseYmd(s); return `${DAYSL[dow(s)].toLowerCase()} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parseYmd(s); return `${DAYS[dow(s)]} ${d.getDate()}/${pad(d.getMonth() + 1)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => (a.length ? sum(a) / a.length : null);

const STATUS = { planned: ['Prévue', '🕒'], inprogress: ['En cours', '▶️'], done: ['Terminée', '✅'], partial: ['Partielle', '🟡'], postponed: ['Reportée', '↪️'], cancelled: ['Annulée', '🚫'], missed: ['Non réalisée', '❌'], unfilled: ['Non renseignée', '❓'] };
const PRAYERS = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
const DEFAULT_REASONS = ['Imprévu professionnel', 'Fatigue', 'Famille / social', 'Déplacement', 'Santé', 'Oubli', 'Manque de motivation', 'Autre'];

/* ---------------- données par défaut ---------------- */
function defaults() {
  const free = {};
  for (let i = 0; i < 7; i++) free[i] = i < 5 ? ['18:45', '22:30'] : ['09:00', '22:30'];
  return {
    v: 1, created: Date.now(),

/* ---------------- stockage IndexedDB (+ repli localStorage) ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('mylifepilot', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode), s = t.objectStore('kv'), r = fn(s);
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
    });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  keys() { return this.tx('readonly', s => s.getAllKeys()); }
};

}

/* ---------------- blocs de planning ---------------- */

/* ---------------- créneaux libres & planificateur ---------------- */
function busyOf(date, excludeId) {

  for (const a of S.appts) if (a.date === date && !a.done && a.time) out.push([hm2min(a.time), hm2min(a.time) + (a.dur || 60), a.title]);
  for (const l of S.libre) if (l.date === date && l.from && l.to) out.push([hm2min(l.from), hm2min(l.to), l.text]);
  return out.sort((a, b) => a[0] - b[0]);
}
function freeSlots(date, { notBefore = 0, margin = 10, excludeId, extra = [] } = {}) {
  const w = S.settings.free[dow(date)]; if (!w) return [];
  const e = hm2min(w[1]); let cur = Math.max(hm2min(w[0]), notBefore);
  const busy = busyOf(date, excludeId).concat(extra.map(x => [x[0], x[1]])).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [bs, be] of busy) {

}

}
function nextQuarter() { return Math.ceil((nowMin() + 10) / 15) * 15; }

}

    const r = weekProgress(q, ws), size = q.sessionMin || 90;

/* ---------------- score & agrégats (une seule source de calcul) ---------------- */
function dayRatio(q, date) {
  const val = qDone(q, date, date);

  for (const b of bl) { const st = effStatus(b); if (st === 'unfilled' || st === 'planned' || st === 'inprogress') continue; const p = blockPlanned(b); pl += p; ac += Math.min(p, st === 'done' ? Math.max(blockActual(b), blockActual(b) ? 0 : p) : blockActual(b)); }

  return val > 0 ? 1 : null;
}
function dayInfo(date, qf = 'all') {
  const t = todayStr();
  if (date > t) return { score: null, comps: [], incomplete: false, future: true };
  const comps = []; let incomplete = false;
  let pl = 0, ac = 0;
  for (const b of S.blocks) {
    if (b.date !== date || !b.q || b.status === 'cancelled' || (qf !== 'all' && b.q !== qf)) continue;
    const st = effStatus(b);
    if (st === 'unfilled') { incomplete = true; continue; }
    if (st === 'planned' || st === 'inprogress') continue;
    const p = blockPlanned(b); pl += p;
    const a = blockActual(b);
    ac += Math.min(p, st === 'done' ? (a || p) : a);
  }
  if (pl > 0) comps.push({ k: 'Planning', v: ac / pl, d: `${fmtDur(ac)} / ${fmtDur(pl)}` });
  const rec = !!(S.reviews[date] && S.reviews[date].closed);
  for (const q of S.quotas) {
    if (q.day == null || (qf !== 'all' && q.id !== qf)) continue;
    const val = qDone(q, date, date), has = S.entries.some(e => e.cat === q.id && e.date === date);
    if (!(has || rec)) continue;
    const v = q.mode === 'max' ? (val <= q.day ? 1 : Math.max(0, 1 - (val - q.day) / q.day)) : Math.min(1, val / q.day);
    comps.push({ k: q.label, v, d: `${fmtVal(q, val)} / ${q.mode === 'max' ? 'max ' : ''}${fmtVal(q, q.day)}` });

    const done = qDone(q, ws, we), target = q.week, pro = el >= 7 ? target : target * el / 7;
    let ratio = null;

  }

/* ---------------- période & statistiques filtrées ---------------- */
function periodOf(kind, date) {

function statsFor(p, qf = 'all') {

  // limites
  for (const q of S.quotas.filter(q => q.mode === 'max')) {
    if (q.day != null) {
      const v = qDone(q, t, t);
      if (v > q.day) A.push({ key: `lim:${q.id}:d:${t}`, lvl: 'danger', icon: q.icon, title: `${q.label} : limite du jour dépassée`, text: `${fmtVal(q, v)} aujourd’hui pour un maximum de ${fmtVal(q, q.day)}.`, acts: [], notify: true });

    }
    const w = qDone(q, ws, we);
    if (w > q.week) A.push({ key: `lim:${q.id}:w:${ws}`, lvl: 'danger', icon: q.icon, title: `${q.label} : limite de la semaine dépassée`, text: `${fmtVal(q, w)} cette semaine pour un maximum de ${fmtVal(q, q.week)}.`, acts: [], notify: true });

  }

    if (diff <= 5 * 3600e3 && diff > -3600e3) A.push({ key: `rdv5:${a.id}`, lvl: 'danger', icon: '🔔', title: `Rendez-vous ${diff > 0 ? 'dans ' + fmtDur(diff / 60000) : 'en cours'} : ${a.title}`, text: `${a.time}${a.place ? ' · ' + a.place : ''}`, acts: [{ l: '✔ C’est bon', act: 'apptDone', id: a.id }], notify: true });
    else if (diff <= 24 * 3600e3 && diff > 5 * 3600e3) A.push({ key: `rdv24:${a.id}`, lvl: 'warn', icon: '🔔', title: `Rendez-vous dans moins de 24 h : ${a.title}`, text: `${fmtDate(a.date)} à ${a.time}${a.place ? ' · ' + a.place : ''}`, acts: [{ l: '✔ C’est bon', act: 'apptDone', id: a.id }], notify: true });
    else if (diff <= -3600e3) A.push({ key: `rdvp:${a.id}`, lvl: 'warn', icon: '🔔', title: `Rendez-vous passé non coché : ${a.title}`, text: `${fmtDate(a.date)} à ${a.time}`, acts: [{ l: '✔ C’est bon', act: 'apptDone', id: a.id }] });
  }

  // conseiller hebdo
  const cap = freeMinutes(t, we);
  let totalUns = 0;
  for (const q of S.quotas.filter(q => q.mode === 'min' && !q.noPlan)) {
    const r = weekProgress(q, ws);

  }
  if (totalUns > cap + 1) A.push({ key: `real:${ws}`, lvl: 'danger', icon: '⚖️', title: 'Objectifs irréalistes pour la semaine restante', text: `Il reste ${fmtDur(totalUns)} à placer pour seulement ${fmtDur(cap)} de créneaux libres. Hiérarchise ou ajuste (avec ton accord).`, acts: [{ l: 'Voir les quotas', act: 'go', tab: 'quotas' }], advisor: true });

function dayItems(date) {

  S.appts.filter(a => a.date === date && a.time).forEach(a => it.push({ k: 'a', id: a.id, s: hm2min(a.time), e: hm2min(a.time) + (a.dur || 60), title: '🔔 ' + a.title, a }));

function layoutCols(items) {

  const flush = () => { const cols = []; cl.forEach(i => { let c = cols.findIndex(ce => ce <= i.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = i.e; i.col = c; }); cl.forEach(i => i.n = cols.length); out.push(...cl); cl = []; };

}
function timeline(dates, sc = 1.1) {

  h += `<div class="hc" style="height:${ht}px">${[...Array(19)].map((_, i) => `<span style="top:${i * 60 * sc}px">${pad(6 + i)}h</span>`).join('')}</div>`;
  for (const d of dates) {

    for (const i of items) {
      const top = (Math.max(i.s, H0) - H0) * sc, hh = Math.max(22, (Math.min(i.e, H1) - Math.max(i.s, H0)) * sc - 2), w = 100 / i.n;
      let cls = 'blk', st = '', c = '#6d7399', ic = '', extra = '';

/* ================= Synchronisation PC ↔ téléphone =================
   Principe : un dépôt GitHub PRIVÉ ne contient qu'un fichier chiffré (AES-GCM, clé dérivée d'un mot de passe).
   Fusion à 3 voies (base = dernier état synchronisé) : aucune saisie n'est écrasée ; une modification gagne sur une suppression.
   Rien de ce qui est propre à l'appareil (thème, chrono en cours, notifications déjà montrées, données de démo) ne voyage. */
const SYNC = { cfg: null, status: 'off', msg: '', last: 0, busy: false, again: false, timer: null, stats: null, changed: false };
const SYNC_PATH = 'mlp-data.json';
const SYNC_ID_COLS = ['quotas', 'blocks', 'entries', 'libre', 'appts', 'proposals', 'audit'];
const SYNC_MAP_COLS = ['reviews', 'wreviews'];
const SYNC_LOCAL_SETTINGS = ['theme', 'notif'];

/* ---------- utilitaires purs (testés en unitaire) ---------- */
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
/* forme canonique : l'ordre des listes ne compte pas (sinon deux appareils s'enverraient la même chose en boucle) */
function syncCanon(o) {
  const c = {}, key = x => (x && x.id != null ? 'i:' + x.id : 'h:' + stable(x));
  for (const k of SYNC_ID_COLS) c[k] = (o[k] || []).slice().sort((x, y) => (key(x) < key(y) ? -1 : key(x) > key(y) ? 1 : 0));
  for (const k of SYNC_MAP_COLS) c[k] = o[k] || {};
  c.reasons = (o.reasons || []).slice().sort(); c.settings = o.settings || {};
  return stable(c);
}
const isDemo = x => !!(x && typeof x === 'object' && x.demo);
function syncable(st) {
  const o = {};
  for (const k of SYNC_ID_COLS) o[k] = JSON.parse(JSON.stringify((st[k] || []).filter(x => !isDemo(x))));
  for (const k of SYNC_MAP_COLS) { o[k] = {}; for (const [d, v] of Object.entries(st[k] || {})) if (!isDemo(v)) o[k][d] = JSON.parse(JSON.stringify(v)); }
  o.reasons = (st.reasons || []).slice();
  const se = JSON.parse(JSON.stringify(st.settings || {})); for (const k of SYNC_LOCAL_SETTINGS) delete se[k];
  o.settings = se;
  return o;
}
function mergeMaps(bm, lm, rm, pref, stats) {
  const out = {}, keys = new Set([...Object.keys(lm), ...Object.keys(rm)]);
  for (const k of keys) {
    const l = lm[k], r = rm[k], b = bm[k], hl = l !== undefined, hr = r !== undefined, hb = b !== undefined;
    const sl = hl ? stable(l) : null, sr = hr ? stable(r) : null, sb = hb ? stable(b) : null;
    if (hl && hr) {
      if (sl === sr) out[k] = l;
      else if (hb && sl === sb) { out[k] = r; stats.fromRemote++; }
      else if (hb && sr === sb) out[k] = l;
      else { stats.conflicts++; out[k] = pref === 'remote' ? r : l; }
    } else if (hl && !hr) {
      if (!hb) out[k] = l;
      else if (sl === sb) stats.removed++;
      else { out[k] = l; stats.conflicts++; }
    } else if (!hl && hr) {
      if (!hb) { out[k] = r; stats.fromRemote++; }
      else if (sr === sb) stats.removed++;
      else { out[k] = r; stats.conflicts++; }
    }
  }
  return out;
}
function mergeArr(ba, la, ra, pref, stats) {
  const key = x => (x && x.id != null ? 'i:' + x.id : 'h:' + stable(x));
  const mp = a => { const m = {}; for (const x of a) m[key(x)] = x; return m; };
  const out = mergeMaps(mp(ba), mp(la), mp(ra), pref, stats), res = [], seen = new Set();
  for (const x of [...la, ...ra]) { const k = key(x); if (!seen.has(k) && out[k] !== undefined) { seen.add(k); res.push(out[k]); } }
  return res;
}
function mergeStrs(ba, la, ra, stats) {
  const mp = a => { const m = {}; for (const x of a) m[x] = x; return m; };
  const out = mergeMaps(mp(ba), mp(la), mp(ra), 'local', stats);
  return [...new Set([...la, ...ra])].filter(x => out[x] !== undefined);
}
/* base = dernier état synchronisé (ou null), L = local, R = distant, pref = 'local' | 'remote' en cas de modification des deux côtés */
function merge3(base, L, R, pref = 'local') {
  const b = base || {}, stats = { fromRemote: 0, conflicts: 0, removed: 0 }, out = {};
  for (const k of SYNC_ID_COLS) out[k] = mergeArr(b[k] || [], L[k] || [], R[k] || [], pref, stats);
  for (const k of SYNC_MAP_COLS) out[k] = mergeMaps(b[k] || {}, L[k] || {}, R[k] || {}, pref, stats);
  out.reasons = mergeStrs(b.reasons || [], L.reasons || [], R.reasons || [], stats);
  out.settings = mergeMaps(b.settings || {}, L.settings || {}, R.settings || {}, pref, stats);
  return { merged: out, stats };
}

/* ---------- chiffrement (WebCrypto) ---------- */
const syncTE = new TextEncoder(), syncTD = new TextDecoder();
function b64e(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { return Uint8Array.from(atob(String(s).replace(/\s/g, '')), c => c.charCodeAt(0)); }
async function deriveKey(pass, salt) {
  const km = await crypto.subtle.importKey('raw', syncTE.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encJson(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), key = await deriveKey(pass, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, syncTE.encode(JSON.stringify(obj))));
  return { app: 'mylifepilot', v: 1, alg: 'AES-GCM/PBKDF2-SHA256-200k', s: b64e(salt), i: b64e(iv), d: b64e(ct) };
}
async function decJson(env, pass) {
  try {
    const key = await deriveKey(pass, b64d(env.s));
    return JSON.parse(syncTD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(env.i) }, key, b64d(env.d))));
  } catch (e) { const er = new Error('BADPASS'); er.code = 'BADPASS'; throw er; }
}

/* ---------- accès GitHub ---------- */
function httpErr(status) { const e = new Error('HTTP ' + status); e.code = status; return e; }
async function ghFetch(cfg, method, path, body, raw) {
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${path}`;
  const headers = { Authorization: 'Bearer ' + cfg.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (body) headers['Content-Type'] = 'application/json';
  return fetch(url, { method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
}
async function fetchRemote(cfg) {
  const r = await ghFetch(cfg, 'GET', '/contents/' + SYNC_PATH);
  if (r.status === 404) { const rr = await ghFetch(cfg, 'GET', ''); if (rr.status === 200) return { sha: null, payload: null }; throw httpErr(rr.status); }
  if (!r.ok) throw httpErr(r.status);
  const j = await r.json(); let text;
  if (j.content && j.encoding === 'base64') text = syncTD.decode(b64d(j.content));
  else { const rr = await ghFetch(cfg, 'GET', '/contents/' + SYNC_PATH, null, true); if (!rr.ok) throw httpErr(rr.status); text = await rr.text(); }
  return { sha: j.sha, payload: await decJson(JSON.parse(text), cfg.pass) };
}
async function pushRemote(cfg, payload, sha) {
  const env = await encJson(payload, cfg.pass);
  const body = { message: `sync ${payload.device} ${new Date().toISOString()}`, content: b64e(syncTE.encode(JSON.stringify(env))) };
  if (sha) body.sha = sha;
  const r = await ghFetch(cfg, 'PUT', '/contents/' + SYNC_PATH, body);
  if (r.status === 409 || r.status === 422) { const e = new Error('retry'); e.code = 'RETRY'; throw e; }
  if (!r.ok) throw httpErr(r.status);
}
function syncErrMsg(e) {
  const c = e && e.code;
  if (c === 401) return 'Jeton GitHub invalide ou expiré.';
  if (c === 403) return 'Accès refusé : le jeton doit avoir le droit « Contents : lecture et écriture » sur le dépôt (ou limite GitHub atteinte).';
  if (c === 404) return 'Dépôt introuvable : vérifie le propriétaire, le nom du dépôt et que le jeton a accès à ce dépôt.';
  if (c === 'BADPASS') return 'Mot de passe de chiffrement incorrect (il doit être identique sur tous les appareils).';
  if (c === 'RETRY') return 'GitHub était occupé, réessaie dans un instant.';
  if (e instanceof TypeError) return 'Hors ligne ou GitHub injoignable.';
  return 'Erreur de synchronisation : ' + (e && e.message ? e.message : e);
}

/* ---------- application de l'état fusionné ---------- */
function applySync(m) {
  for (const k of SYNC_ID_COLS) S[k] = m[k].concat((S[k] || []).filter(isDemo));
  for (const k of SYNC_MAP_COLS) { const keep = {}; for (const [d, v] of Object.entries(S[k] || {})) if (isDemo(v)) keep[d] = v; S[k] = Object.assign({}, m[k], keep); }
  S.reasons = m.reasons.length ? m.reasons : DEFAULT_REASONS.slice();
  for (const k of Object.keys(S.settings)) if (!SYNC_LOCAL_SETTINGS.includes(k) && !(k in m.settings)) delete S.settings[k];
  Object.assign(S.settings, m.settings);
  migrate();
}

/* ---------- état affiché ---------- */
const syncClock = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

  if (!c || !c.on) return `<button class="btn sm syb" ${A('go', { tab: 'settings' })} title="Synchronisation PC ↔ téléphone : non configurée" aria-label="Configurer la synchronisation">☁️<span class="thl">Synchro</span></button>`;

  const lab = st === 'busy' ? 'En cours' : st === 'err' ? 'Erreur' : st === 'offline' ? 'Hors ligne' : (SYNC.last ? syncClock(SYNC.last) : '…');

}
function syncStatusText() {
  const c = SYNC.cfg; if (!c || !c.on) return 'Non configurée.';
  const st = SYNC.status;
  if (st === 'busy') return 'Synchronisation en cours…';
  if (st === 'err') return '⚠️ ' + SYNC.msg;

  const s = SYNC.stats;
  return SYNC.last ? `✓ Dernière synchronisation à ${syncClock(SYNC.last)}${s ? ` · ${s.fromRemote} élément(s) reçu(s)${s.conflicts ? ` · ${s.conflicts} modification(s) simultanée(s) fusionnée(s)` : ''}` : ''}` : 'Prête, pas encore synchronisée.';
}

/* ---------- moteur ---------- */
function syncNow(reason) {
  if (!SYNC.cfg || !SYNC.cfg.on) return Promise.resolve({ ok: false, msg: 'non configurée' });
  if (SYNC.busy) { SYNC.again = true; return SYNC.promise; }
  SYNC.promise = syncRun(reason); return SYNC.promise;
}
async function syncRun(reason) {
  const cfg = SYNC.cfg;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) { setSync('offline'); return { ok: false, msg: 'hors ligne' }; }
  SYNC.busy = true; setSync('busy');
  let result = { ok: true };
  try {
    for (let tries = 1; ; tries++) {
      const rem = await fetchRemote(cfg);
      const loc = syncable(S), braw = await baseGet(), base = braw ? JSON.parse(braw) : null;
      let merged = loc, stats = { fromRemote: 0, conflicts: 0, removed: 0 }, needPush = true;
      if (rem.payload) {
        const pref = (rem.payload.mod || 0) > (S._mod || 0) ? 'remote' : 'local';
        const res = merge3(base, loc, rem.payload.data, pref); merged = res.merged; stats = res.stats;
        needPush = syncCanon(merged) !== syncCanon(rem.payload.data);
      }
      const changed = syncCanon(merged) !== syncCanon(loc);
      if (changed) { await presyncBackup(); applySync(merged); await persist(); }
      if (needPush) {
        try { await pushRemote(cfg, { app: 'mlp', ver: VERSION, mod: Date.now(), device: cfg.device || 'appareil', data: merged }, rem.sha); }
        catch (e) { if (e.code === 'RETRY' && tries < 3) continue; throw e; }
      }
      await baseSet(JSON.stringify(merged));
      SYNC.last = Date.now(); SYNC.stats = stats; SYNC.changed = changed; result = { ok: true, changed, stats, pushed: needPush };
      break;
    }
    setSync('ok');
    if (result.changed) { if (!$('#modal') && !isTyping()) render(); toast('☁️ Données mises à jour depuis l’autre appareil', 'good', 3000, 'sync'); }
  } catch (e) { result = { ok: false, msg: syncErrMsg(e) }; setSync(e instanceof TypeError ? 'offline' : 'err', result.msg); }
  finally { SYNC.busy = false; if (SYNC.again) { SYNC.again = false; syncSoon(2500); } }
  return result;
}
function syncSoon(ms = 15000) {
  if (!SYNC.cfg || !SYNC.cfg.on) return;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncNow('auto'), ms);
}
async function syncInit() {
  SYNC.cfg = await cfgLoad();
  setInterval(() => { if (!document.hidden) syncNow('timer'); }, 180000);
  window.addEventListener('online', () => syncNow('online'));
  if (SYNC.cfg && SYNC.cfg.on) { setSync('busy'); setTimeout(() => syncNow('open'), 700); }
}

function applyReplan(id, date, start, dur, mark) {
  const b = S.blocks.find(x => x.id === id); if (!b) return;

/* ---------- chronomètre ---------- */
function timerStartFor(id) {
  if (S.timer) { toast('Un chronomètre est déjà en cours.', 'warn'); return timerModal(); }
  if (id) {
    const b = S.blocks.find(x => x.id === id); if (!b) return;
    if (!b.q) return toast('Ce bloc n’est lié à aucun quota : rien à chronométrer.', 'warn');
    const lim = Math.max(5, blockPlanned(b) - Math.round(blockActual(b)));
    S.timer = { cat: b.q, blockId: b.id, label: b.title, startedAt: NOWFN().getTime(), acc: 0, running: true, limit: lim, alerted: false };
    if (b.status === 'planned') b.status = 'inprogress';

  }
  modal(`<h2>⏱ Chrono libre</h2><form class="fm" data-form="timerNew"><label>Quota<select name="cat">${S.quotas.filter(q => !q.prayers && q.id !== 'sommeil' && q.id !== 'cigarette').map(q => `<option value="${q.id}">${q.icon} ${esc(q.label)}</option>`).join('')}</select></label><label>Titre (facultatif)<input name="label" placeholder="Ex. Révision TVA"></label><label>Alerte de dépassement après (min, facultatif)<input type="number" name="limit" min="1" placeholder="ex. 90"></label><button class="btn pri" type="submit">▶ Démarrer</button></form>`);

function tick1s() {

/* ---------- démo ---------- */
function loadDemo() {
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = todayStr(), start = addDays(weekStartOf(t), -28);
  const tpl = { 0: [['revision', '18:45', '20:15'], ['freelance', '20:30', '22:30']], 1: [['sport', '18:30', '20:30'], ['apprentissage', '21:00', '22:00']], 2: [['revision', '18:45', '20:15'], ['freelance', '20:30', '22:30']], 3: [['revision', '18:45', '20:15'], ['apprentissage', '20:30', '21:30']], 4: [['sport', '18:30', '20:30'], ['freelance', '21:00', '22:30']], 5: [['freelance', '10:00', '14:00'], ['sport', '16:00', '18:00'], ['apprentissage', '20:00', '21:30']], 6: [['revision', '10:00', '12:00'], ['freelance', '14:00', '18:00']] };
  const reasonsL = S.reasons;
  for (let d = start; d <= addDays(weekStartOf(t), 6); d = addDays(d, 1)) {
    const i = dow(d), past = d < t;
    if (i < 5) S.blocks.push({ id: uid(), demo: 1, date: d, start: '08:30', end: '17:00', title: 'Travail', q: null, status: 'done', fixed: true });
    for (const [qid, s, e] of tpl[i]) {
      const q = Q(qid), b = { id: uid(), demo: 1, date: d, start: s, end: e, title: q.label, q: qid, status: 'planned', fixed: false }, p = blockPlanned(b);
      S.blocks.push(b);
      if (!past) continue;
      const r = rnd();
      if (r < .72) { b.status = 'done'; const a = Math.round(p * (0.9 + rnd() * .2)); S.entries.push({ id: uid(), demo: 1, date: d, time: e, cat: qid, v: q.kind === 'duration' ? a : 1, mins: q.kind === 'count' ? a : 0, blockId: b.id, src: 'bloc', note: '', ts: Date.now() }); }
      else if (r < .85) { b.status = 'partial'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; const a = Math.round(p * .5); S.entries.push({ id: uid(), demo: 1, date: d, time: e, cat: qid, v: q.kind === 'duration' ? a : 0, mins: q.kind === 'count' ? a : 0, blockId: b.id, src: 'bloc', note: '', ts: Date.now() }); }
      else if (r < .95) { b.status = 'missed'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; }
      else { b.status = 'postponed'; b.reason = reasonsL[Math.floor(rnd() * reasonsL.length)]; }
    }
    if (past) {
      const n = 12 + Math.floor(rnd() * 12); for (let k = 0; k < n; k++) S.entries.push({ id: uid(), demo: 1, date: d, time: min2hm(480 + Math.floor(k * 60 + rnd() * 20)), cat: 'cigarette', v: 1, src: 'manual', note: '', ts: Date.now() });
      S.entries.push({ id: uid(), demo: 1, date: d, time: '06:30', cat: 'sommeil', v: 330 + Math.floor(rnd() * 150), src: 'manual', note: '23:00 → 06:30', ts: Date.now() });
      PRAYERS.forEach(p => { if (rnd() < .82) S.entries.push({ id: uid(), demo: 1, date: d, time: '12:00', cat: 'priere', sub: p, v: 1, src: 'manual', note: '', ts: Date.now() }); });
      if (rnd() < .5) S.entries.push({ id: uid(), demo: 1, date: d, time: '15:00', cat: 'cafe', v: 60 + Math.floor(rnd() * 120), src: 'manual', note: 'café + travail', ts: Date.now() });
      S.reviews[d] = { closed: true, ts: Date.now(), mood: 2 + Math.floor(rnd() * 4), energy: 2 + Math.floor(rnd() * 4), note: rnd() < .3 ? 'Journée chargée au bureau, fatigue en fin de soirée.' : '', demo: 1 };
    }
  }
  S.appts.push({ id: uid(), demo: 1, title: 'Rendez-vous banque', date: addDays(t, 1), time: '10:00', dur: 60, place: 'Agence centre-ville', note: '', done: false });
  S.appts.push({ id: uid(), demo: 1, title: 'Client SGC — appel', date: addDays(t, 3), time: '17:30', dur: 30, place: '', note: '', done: false });
  S.libre.push({ id: uid(), demo: 1, date: addDays(t, -1), from: '15:00', to: '17:00', text: 'Hammam', cat: '' });
  log('démo', 'Données de démonstration chargées'); save();
}

const FORMS = {
  entrySave(fd) {
    const cat = fd.get('cat'), q = Q(cat), id = fd.get('id'); let v, mins = 0;
    if (q.kind === 'duration') { v = (+fd.get('h') || 0) * 60 + (+fd.get('m') || 0); const qd = fd.get('qd'); if (!v && qd) v = +qd; } else { v = +fd.get('qty') || 0; mins = +fd.get('mins') || 0; }
    if (q.kind === 'duration' && v <= 0) return toast('Indique une durée.', 'warn');
    const o = { cat, date: fd.get('date'), time: fd.get('time') || '', v, mins, note: fd.get('note') || '', sub: q.prayers ? fd.get('sub') : '' };
    if (id) { Object.assign(S.entries.find(x => x.id === id), o); log('saisie', `Modifié : ${q.label} ${o.date}`); save(); }
    else addEntry(o);
    closeModal(); render(); checkLimitToast(q);
  },
  blockSave(fd) {
    const id = fd.get('id'), qid = fd.get('q') || null, s = fd.get('start'), e = fd.get('end'), date = fd.get('date');
    if (hm2min(e) <= hm2min(s)) return toast('L’heure de fin doit être après le début.', 'warn');
    const title = (fd.get('title') || '').trim() || (qid ? Q(qid).label : 'Activité');
    const base = { title, q: qid, start: s, end: e, fixed: !!fd.get('fixed'), note: fd.get('note') || '' };
    const dates = [];
    if (!id && fd.get('rep') === '1') { const weeks = clamp(+fd.get('weeks') || 1, 1, 52), ws = weekStartOf(date); for (let w = 0; w < weeks; w++) for (let i = 0; i < 7; i++) if (fd.get('d' + i)) { const d = addDays(ws, w * 7 + i); if (d >= date) dates.push(d); } } else dates.push(date);
    if (!dates.length) return toast('Choisis au moins un jour.', 'warn');
    const conf = []; for (const d of dates) for (const [bs, be, nm] of busyOf(d, id)) if (hm2min(s) < be && hm2min(e) > bs) conf.push(`${fmtShort(d)} ${min2hm(bs)}–${min2hm(be)} ${nm || ''}`);
    if (conf.length && !confirm('⚠️ Chevauchement détecté :\n' + conf.slice(0, 5).join('\n') + '\n\nEnregistrer quand même ?')) return;
    if (id) { Object.assign(S.blocks.find(x => x.id === id), base, { date }); log('bloc', `Modifié : ${title} ${date}`, id); }
    else { const series = dates.length > 1 ? uid() : null; for (const d of dates) S.blocks.push({ id: uid(), date: d, status: 'planned', series, ...base }); log('bloc', `Créé : ${title} × ${dates.length}`); }
    save(); closeModal(); render(); toast(id ? 'Bloc modifié' : `${dates.length} bloc(s) créé(s)`, 'good');
  },
  qualifySave(fd) {
    const b = S.blocks.find(x => x.id === fd.get('id')), out = fd.get('out'), add = Math.max(0, +fd.get('add') || 0), reason = fd.get('reason') || '', note = fd.get('note') || '';
    const q = Q(b.q); b.note = note || b.note; if (reason) b.reason = reason;
    const back = UI.backToBilan; UI.backToBilan = null;
    let next = null;
    if (out === 'done') { recordDone(b, add, true); b.status = 'done'; b.reason = ''; }
    else if (out === 'partial') { recordDone(b, add, false); b.status = 'partial'; if (fd.get('rp')) next = { remain: Math.max(15, blockPlanned(b) - Math.round(blockActual(b))) }; }
    else if (out === 'missed') { b.status = 'missed'; if (fd.get('rp')) next = { remain: null }; }
    else if (out === 'postponed') { next = { remain: null, postpone: true }; }
    else if (out === 'cancelled') b.status = 'cancelled';
    log('bloc', `${b.title} (${b.date}) → ${STATUS[out][0]}${reason ? ' — ' + reason : ''}`, b.id); save(); closeModal();
    UI.backToBilan = back;
    if (next) { if (out === 'partial') replanModal(b.id, { remain: next.remain }); else replanModal(b.id, {}); }
    else if (back) { UI.backToBilan = null; render(); bilanModal(back); return; }
    render();
  },
  replanManual(fd) { const id = fd.get('id'); applyReplan(id, fd.get('date'), fd.get('s'), +fd.get('dur'), fd.get('mark')); closeModal(); render(); },
  libreSave(fd) {
    const id = fd.get('id'), o = { date: fd.get('date'), from: fd.get('from') || '', to: fd.get('to') || '', text: (fd.get('text') || '').trim(), cat: fd.get('cat') || '' };
    if (o.from && o.to && hm2min(o.to) <= hm2min(o.from)) return toast('Heure de fin avant le début.', 'warn');
    let l = id ? S.libre.find(x => x.id === id) : null;
    if (l) Object.assign(l, o); else { l = { id: uid(), ...o }; S.libre.push(l); }
    if (l.entryId) { S.entries = S.entries.filter(e => e.id !== l.entryId); l.entryId = null; }
    if (l.cat && l.from && l.to) { const q = Q(l.cat), m = hm2min(l.to) - hm2min(l.from); const e = addEntry({ cat: l.cat, v: q.kind === 'duration' ? m : 1, mins: q.kind === 'count' ? m : 0, date: l.date, time: l.from, note: l.text, src: 'libre' }); l.entryId = e.id; }
    log('libre', `Note libre : ${l.text.slice(0, 50)}`); save(); closeModal(); render(); toast('Enregistré', 'good');
  },
  apptSave(fd) {
    const id = fd.get('id'), o = { title: fd.get('title').trim(), date: fd.get('date'), time: fd.get('time'), dur: +fd.get('dur') || 60, place: fd.get('place') || '', note: fd.get('note') || '' };
    if (id) Object.assign(S.appts.find(x => x.id === id), o, { done: false }); else S.appts.push({ id: uid(), done: false, ...o });
    log('rdv', `Rendez-vous : ${o.title} ${o.date} ${o.time}`); save(); closeModal(); render(); toast('Rendez-vous enregistré — rappels 24 h et 5 h programmés', 'good');
  },
  quotaSave(fd) {
    const id = fd.get('id'), kind = fd.get('kind'), h = kind === 'duration', mul = h ? 60 : 1;
    const o = { label: fd.get('label').trim(), icon: fd.get('icon') || '⭐', color: fd.get('color'), kind, mode: fd.get('mode'), week: Math.round((+fd.get('week') || 0) * mul), day: fd.get('day') === '' ? null : Math.round(+fd.get('day') * mul), sessionMin: +fd.get('sessionMin') || 60, noPlan: !!fd.get('noPlan'), overlap: !!fd.get('overlap') };
    if (id) { const q = Q(id); if (q.week !== o.week) { S.proposals.push({ id: uid(), ts: Date.now(), kind: 'objectif', q: id, text: `${q.label} : ${fmtTarget(q, q.week)} → ${fmtTarget({ ...q, ...o }, o.week)} (modification manuelle)`, decision: 'accepté' }); log('objectif', `Objectif modifié : ${q.label}`); } Object.assign(q, o); }
    else S.quotas.push({ id: 'q' + uid(), prio: 5, unit: kind === 'count' ? 'fois' : '', ...o });
    save(); closeModal(); render();
  },
  async syncSave(fd) {
    const old = SYNC.cfg || {};
    const c = { owner: (fd.get('owner') || '').trim(), repo: (fd.get('repo') || '').trim().replace(/^.*\//, ''), token: (fd.get('token') || '').trim() || old.token || '', pass: fd.get('pass') || old.pass || '', on: true, device: (fd.get('device') || '').trim() || old.device || (/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'Téléphone' : 'PC') };
    if (!c.owner || !c.repo) return toast('Indique le propriétaire et le nom du dépôt de données.', 'warn');
    if (!c.token) return toast('Colle le jeton GitHub.', 'warn');
    if (c.pass.length < 6) return toast('Mot de passe de chiffrement : 6 caractères minimum.', 'warn');
    SYNC.cfg = c; await cfgSave(c); setSync('busy');
    const r = await syncNow('setup');
    if (r.ok) { toast('☁️ Synchronisation activée ✓', 'good'); render(); } else toast('⚠️ ' + r.msg, 'warn', 6000);
  },
  settingsSave(fd) {
    const s = S.settings; s.theme = fd.get('theme'); s.name = (fd.get('name') || '').trim() || 'Hamza'; s.bilanHour = clamp(parseInt((fd.get('bilanHour') || '23:00').split(':')[0], 10) || 23, 18, 23);
    for (let i = 0; i < 7; i++) s.free[i] = fd.get('f' + i + 'n') ? null : [fd.get('f' + i + 's'), fd.get('f' + i + 'e')];
    S.reasons = (fd.get('reasons') || '').split('\n').map(x => x.trim()).filter(Boolean); if (!S.reasons.length) S.reasons = DEFAULT_REASONS.slice();
    save(); applyTheme(); render(); toast('Réglages enregistrés', 'good');
  },
  workAdd(fd) {
    const s = fd.get('s'), e = fd.get('e'), w = clamp(+fd.get('w') || 1, 1, 52), ws = weekStartOf(todayStr()), series = uid(); let n = 0;
    for (let k = 0; k < w; k++) for (let i = 0; i < 5; i++) { const d = addDays(ws, k * 7 + i); if (d < todayStr() || S.blocks.some(b => b.date === d && b.title === 'Travail' && !b.q)) continue; S.blocks.push({ id: uid(), date: d, start: s, end: e, title: 'Travail', q: null, status: 'done', fixed: true, series }); n++; }
    save(); render(); toast(`${n} bloc(s) de travail ajouté(s)`, 'good');
  },
  applyPlan(fd) {
    const r = UI.calAuto; let n = 0; const series = uid();
    r.prop.forEach((p, i) => { if (fd.get('p' + i)) { S.blocks.push({ id: uid(), date: p.date, start: p.start, end: p.end, title: p.title, q: p.q, status: 'planned', fixed: false, auto: true }); n++; } });
    S.proposals.push({ id: uid(), ts: Date.now(), kind: 'planning', text: `${n} créneau(x) proposés par le planificateur`, decision: n ? 'accepté' : 'refusé' });
    log('planning', `Planning proposé appliqué : ${n} bloc(s)`); UI.calAuto = null; save(); toast(`${n} bloc(s) ajoutés au calendrier`, 'good'); UI.calDate = todayStr(); UI.calView = 'week'; setTab('cal');
  },
  sleepSave(fd) {
    const bed = hm2min(fd.get('bed')), wake = hm2min(fd.get('wake')); let m = wake - bed; if (m <= 0) m += 1440;
    const d = curDate(); S.entries = S.entries.filter(e => !(e.cat === 'sommeil' && e.date === d));
    addEntry({ cat: 'sommeil', v: m, date: d, time: fd.get('wake'), note: `${fd.get('bed')} → ${fd.get('wake')}` });
    const bd = UI.bilanForDate; closeModal(); render(); if (bd) bilanModal(bd); toast(`Sommeil : ${fmtDur(m)}`, m >= 420 ? 'good' : 'warn');
  },
  timerNew(fd) { S.timer = { cat: fd.get('cat'), blockId: null, label: (fd.get('label') || '').trim() || Q(fd.get('cat')).label, startedAt: NOWFN().getTime(), acc: 0, running: true, limit: +fd.get('limit') || null, alerted: false }; log('chrono', `Démarrage : ${S.timer.label}`); save(); closeModal(); render(); timerModal(); },
  timerStopSave(fd) {
    const T = S.timer, q = Q(T.cat), min = Math.max(1, +fd.get('min') || 1), b = T.blockId && S.blocks.find(x => x.id === T.blockId), fin = fd.get('fin');
    if (q.kind === 'duration') addEntry({ cat: q.id, v: min, blockId: T.blockId || undefined, src: 'timer', note: fd.get('note') || '', date: b ? b.date : todayStr() });
    else addEntry({ cat: q.id, v: fd.get('unit') ? 1 : 0, mins: min, blockId: T.blockId || undefined, src: 'timer', note: fd.get('note') || '', date: b ? b.date : todayStr() });
    if (b) { b.status = fin === 'partial' ? 'inprogress' : 'done'; if (fin !== 'partial') b.reason = ''; }
    log('chrono', `Terminé : ${T.label} — ${fmtDur(min)}`); S.timer = null; save(); closeModal(); render();
    if (q.mode === 'max') checkLimitToast(q); toast(`✅ ${fmtDur(min)} enregistrées`, 'good');
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const h = FORMS[f.dataset.form]; if (h) h(new FormData(f), f); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.live) {
    const k = t.dataset.live, n = t.name, v = t.value;
    if (k === 'jf') { UI.jf[n] = v; $('#jres').innerHTML = journalTable(); }
    else if (k === 'sf') { UI.sf[n] = v; $('#sres').innerHTML = searchTable(); }
    else if (k === 'libre') { UI.libreText = v; $('#lres').innerHTML = libreList(); }
    else if (k === 'stq') { UI.statQ = v; render(); }
  }
  if (t.dataset.draft) { const dr = UI.bilanDraft || (UI.bilanDraft = {}); dr[t.dataset.draft] = t.dataset.draft === 'note' ? t.value : +t.value; }
  if (t.name === 'add') t.dataset.touched = 1;
  if (t.dataset.qk === 'quickdur') { const f = t.closest('form'); f.h.value = Math.floor(+t.value / 60); f.m.value = +t.value % 60; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.live && t.tagName === 'SELECT' && t.dataset.live !== 'stq') { /* déjà traité par input */ }
  if (t.dataset.qk === 'entrycat') toggleKind(t.closest('form'));
  if (t.dataset.qk === 'outcome') toggleOutcome(t.closest('form'));
  if (t.dataset.qk === 'rep') $('#repbox').classList.toggle('hide', t.value !== '1');
  if (t.id === 'impfile' && t.files[0]) {
    const r = new FileReader();
    r.onload = async () => { try { const s = JSON.parse(r.result); if (!s.quotas || !s.entries || !s.blocks) throw new Error('format'); if (!confirm('Remplacer toutes les données actuelles par ce fichier ?')) return; try { await DB.set('bak-avant-import-' + Date.now(), JSON.stringify(S)); } catch (e) { } S = s; migrate(); await persist(); render(); toast('Données importées', 'good'); } catch (e) { toast('Fichier invalide : sauvegarde My Life Pilot (.json) attendue.', 'danger'); } };
    r.readAsText(t.files[0]);
  }
});

/* ================= Démarrage ================= */
function checkNotify() {
  const al = alerts().filter(a => a.notify); let shown = 0; const now = Date.now();
  for (const a of al) { if (S.notified[a.key]) continue; S.notified[a.key] = now; if (shown < 3) { toast(`${a.icon} <b>${esc(a.title)}</b><br><span class="rt">${esc(a.text)}</span>`, a.lvl === 'danger' ? 'danger' : 'warn', 7000); notify(a.title, a.text); shown++; } }
  for (const k of Object.keys(S.notified)) if (now - S.notified[k] > 3 * 864e5) delete S.notified[k];
  if (shown) save();
}
async function boot() {
  await load(); applyTheme();
  const h = location.hash.slice(1); if (VIEWS[h]) UI.tab = h;
  const fab = document.createElement('button'); fab.className = 'fab'; fab.textContent = '＋'; fab.title = 'Saisie rapide'; fab.dataset.act = 'quick'; fab.setAttribute('aria-label', 'Saisie rapide'); document.body.appendChild(fab);
  render(false); checkNotify();
  setInterval(tick1s, 1000);
  setInterval(() => { if (!$('#modal') && !isTyping() && ['cockpit', 'cal'].includes(UI.tab)) render(); checkNotify(); renderNav(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); syncNow('hide'); } else { if (!$('#modal') && !isTyping()) render(); checkNotify(); if (Date.now() - SYNC.last > 20000) syncNow('show'); } });
  window.addEventListener('pagehide', persist);
  const kbOn = e => { if (e.target && e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select')) document.body.classList.add('kb'); };
  document.addEventListener('focusin', kbOn);
  document.addEventListener('focusout', () => setTimeout(() => { if (!isTyping()) document.body.classList.remove('kb'); }, 120));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== UI.tab) { UI.tab = h; render(false); } });
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change', applyTheme);
  syncInit();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  window.MLP = { SYNC, syncNow, merge3, syncable, get S() { return S; }, set S(v) { S = v; }, UI, render, alerts, dayInfo, weekInfo, statsFor, periodOf, autoPlan, effStatus, loadDemo, persist, load, DB, qDone };
}
boot();
